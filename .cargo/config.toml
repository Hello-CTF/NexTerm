# NexTerm 构建配置
# cargo 从工作目录向上查找本文件，在任意一层执行命令均生效。

# target 目录保持默认。自动化构建环境由 scripts/build.mjs 通过
# CARGO_TARGET_DIR 重定向到工作区外，本地终端构建不受影响。

# 链接器：Windows-MSVC 默认的 link.exe 基本单线程，改用工具链自带的 rust-lld。
# rustc 对名称 rust-lld 有内置解析，直接从 sysroot 取用，无需配置 PATH。
# linker 属于构建指纹的一部分，首次切换会触发一次全量重编。
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"
