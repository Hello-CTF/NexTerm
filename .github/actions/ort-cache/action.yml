name: ONNX Runtime download cache
description: >-
  Restores the ONNX Runtime archives that scripts/ai-privacy-runtime.mjs
  downloaded into .tmp/ai-privacy-runtime/<version> for this runner and staging
  target. The privacy runtime tool owns that layout and reuses an archive only
  when it matches the published digest. Only master runs (the cache-warm
  workflow) save.
inputs:
  version:
    description: Resolved ONNX Runtime version (needs.version.outputs.ort-version)
    required: true
  target:
    description: Runtime target(s) the job stages, for example linux-amd64 or android-arm64
    required: true
runs:
  using: composite
  steps:
    # Archive names keep their dots while the tool's extraction directories
    # replace them with hyphens, so *.* caches the downloads alone.
    - name: Restore and save ONNX Runtime downloads
      if: github.ref == 'refs/heads/master'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tmp/ai-privacy-runtime/${{ inputs.version }}/*.*
        key: nexterm-ort-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}
        restore-keys: nexterm-ort-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Restore ONNX Runtime downloads
      if: github.ref != 'refs/heads/master'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .tmp/ai-privacy-runtime/${{ inputs.version }}/*.*
        key: nexterm-ort-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}
        restore-keys: nexterm-ort-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}-
