name: Cache warm

# Pull request caches are scoped to their own ref, and CI does not run on
# master, so without this workflow every new pull request starts cold. This
# workflow runs no quality gates; it only fills the master-scoped caches that
# every pull request can restore, using the same composite actions and keys as
# CI. It reruns when the dependency inputs change and weekly, which also picks
# up new runner images.
on:
  push:
    branches: [master]
    paths:
      - go.mod
      - go.sum
      - package.json
      - pnpm-lock.yaml
      - .github/actions/**
      - .github/workflows/cache-warm.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cache-warm
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.27.3
  GOFLAGS: -mod=readonly

jobs:
  linux:
    name: Linux ${{ matrix.arch }} caches
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Warm the GTK and WebKitGTK package cache
        uses: ./.github/actions/linux-gui-deps
      - name: Warm the Go test job's package cache
        if: matrix.arch == 'amd64'
        uses: ./.github/actions/linux-gui-deps
        with:
          packages: zsh openssh-server
      # amd64 also fills the build cache profile the Go test and database jobs restore.
      - uses: ./.github/actions/go-toolchain
        with:
          build-cache: ${{ matrix.arch == 'amd64' && 'test' || '' }}
      - name: Download Go modules
        run: go mod download
      # -exec=true builds, vets and links every test binary but runs none of them.
      - name: Compile every test binary without running it
        if: matrix.arch == 'amd64'
        run: go test -count=1 -exec=true ./...
      - name: Warm the Wails CLI cache
        if: matrix.arch == 'amd64'
        uses: ./.github/actions/wails-cli
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: matrix.arch == 'amd64'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.arch == 'amd64'
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Warm the pnpm store
        if: matrix.arch == 'amd64'
        run: pnpm install --frozen-lockfile

  modules:
    name: ${{ matrix.os }} Go modules and Wails CLI
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            os: macOS
          - runner: windows-latest
            os: Windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/go-toolchain
      - name: Download Go modules
        run: go mod download
      - name: Warm the Wails CLI cache
        uses: ./.github/actions/wails-cli
