name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      release_version:
        description: "Release version stamped into artifacts (without the leading v); empty means the wails.json placeholder"
        required: false
        type: string
      updater_public_key:
        description: "Non-secret minisign updater public key embedded in release desktop binaries"
        required: false
        type: string
      ort_version:
        description: "ONNX Runtime version resolved once by the caller; empty resolves the latest stable 1.x here"
        required: false
        type: string
    secrets:
      NEXTERM_ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      NEXTERM_IOS_P12_BASE64:
        required: false
      NEXTERM_IOS_P12_PASSWORD:
        required: false
      NEXTERM_IOS_PROVISIONING_PROFILE:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: go1.27.3
  GOFLAGS: -mod=readonly

jobs:
  version:
    name: Plan checks and resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      ort-version: ${{ steps.toolchain.outputs.ort_version }}
      native-matrix: ${{ steps.plan.outputs.matrix }}
      unit-matrix: ${{ steps.plan.outputs.unitMatrix }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select checks and group native builds by platform
        id: plan
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node .github/scripts/ci-plan.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Resolve the latest ONNX Runtime once for every job
        id: toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXTERM_ORT_VERSION: ${{ inputs.ort_version || vars.NEXTERM_ORT_VERSION }}
        run: node scripts/resolve-toolchain.mjs >> "$GITHUB_OUTPUT"
      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          raw="$INPUT_VERSION"
          if [ -z "$raw" ] && [ "$REF_TYPE" = "tag" ]; then raw="$REF_NAME"; fi
          version="${raw#v}"
          if [ -n "$version" ] && ! node scripts/check-semver.mjs "$version"; then
            echo "invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  frontend:
    name: Reproducible frontend
    needs: version
    if: fromJSON(needs.version.outputs.scope).frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      NEXTERM_ORT_VERSION: ${{ needs.version.outputs.ort-version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Reproducible real frontend
        run: node scripts/build.mjs frontend --repro-check
      - name: Upload the verified frontend dist and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: |
            dist/
            target/dist-manifest.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # Lint and the unit tests used to run inside the frontend job, so every native build waited for them although it only
  # needs the built dist. They run beside it now; ci-ok still requires all of them.
  frontend-lint:
    name: Frontend lint
    needs: version
    if: fromJSON(needs.version.outputs.scope).frontendTests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend lint
        run: pnpm lint

  # The unit tests run in shards. The coverage gate is per file, so a shard sees only part of each file's coverage:
  # shards write blob reports with the thresholds off, and frontend-coverage merges them and enforces the gate.
  frontend-test:
    name: Frontend tests (${{ matrix.shard }}/4)
    needs: version
    if: fromJSON(needs.version.outputs.scope).frontendTests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run this shard of the frontend unit tests
        run: >-
          pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=blob
          --coverage.thresholds.perFile=false --coverage.thresholds.lines=0 --coverage.thresholds.functions=0
          --coverage.thresholds.branches=0 --coverage.thresholds.statements=0
      - name: Upload this shard's report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  frontend-coverage:
    name: Frontend coverage gate
    needs: [version, frontend-test]
    if: fromJSON(needs.version.outputs.scope).frontendTests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: .vitest/blob
      - name: Merge the shard reports and enforce the coverage gate
        run: pnpm exec vitest run --merge-reports --coverage

  quality:
    name: Go/Wails quality gates
    needs: version
    if: fromJSON(needs.version.outputs.scope).quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      NEXTERM_ORT_VERSION: ${{ needs.version.outputs.ort-version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Wails cgo prerequisites
        uses: ./.github/actions/linux-gui-deps
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - uses: ./.github/actions/go-toolchain
        with:
          build-cache: quality
      - uses: ./.github/actions/wails-cli
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Shared CI quality gates
        run: wails3 task check:ci-quality
      - name: Vet Windows platform and test code
        env:
          GOOS: windows
        run: go vet ./...

  unit:
    # The packages are split across runners by measured test time (.github/go-test-weights.json), so the job takes
    # about as long as its slowest package instead of the sum of all of them.
    name: Go tests (${{ matrix.number }}/${{ matrix.count }})
    needs: version
    if: fromJSON(needs.version.outputs.scope).unit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.unit-matrix) }}
    env:
      RACE_PACKAGE_PARALLELISM: "4"
      RACE: ${{ fromJSON(needs.version.outputs.scope).race }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Wails cgo prerequisites and test shells
        uses: ./.github/actions/linux-gui-deps
        with:
          packages: zsh openssh-server
      - uses: ./.github/actions/go-toolchain
        with:
          build-cache: ${{ fromJSON(needs.version.outputs.scope).race && 'test-race' || 'test' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Pick the packages of this shard
        id: shard
        run: |
          flags=(--shard "${{ matrix.shard }}" --count "${{ matrix.count }}")
          if [ "$RACE" = "true" ]; then flags+=(--race); fi
          node .github/scripts/go-shards.mjs "${flags[@]}" >> "$GITHUB_OUTPUT"
      - name: Run this shard's Go tests
        if: ${{ !fromJSON(needs.version.outputs.scope).race }}
        env:
          PACKAGES: ${{ steps.shard.outputs.plain }}
        run: go test -count=1 $PACKAGES
      - name: Run this shard's Go tests with the race detector (full-ci)
        if: fromJSON(needs.version.outputs.scope).race
        env:
          RACE_PACKAGES: ${{ steps.shard.outputs.race }}
          PLAIN_PACKAGES: ${{ steps.shard.outputs.plain }}
        # Keep in sync with the Taskfile test:race task: checkptr is skipped
        # only in the transpiled SQLite driver; race instrumentation stays on.
        # Build and release tooling is tested without the race detector (see go-shards.mjs).
        run: |
          status=0
          if [ -n "$RACE_PACKAGES" ]; then
            go test -race -count=1 -timeout=25m '-gcflags=modernc.org/...=-d=checkptr=0' -p=${RACE_PACKAGE_PARALLELISM} $RACE_PACKAGES || status=$?
          fi
          if [ -n "$PLAIN_PACKAGES" ]; then
            go test -count=1 $PLAIN_PACKAGES || status=$?
          fi
          exit $status
      - name: Run terminal workloads that intentionally skip race instrumentation
        if: ${{ fromJSON(needs.version.outputs.scope).race && matrix.shard == 0 }}
        run: go test -count=1 ./internal/terminal -run '^(TestThroughputAcceptanceWorkload|TestHighVolumeFeedMemoryBounded)$'

  database:
    needs: version
    if: fromJSON(needs.version.outputs.scope).database
    name: Database contracts (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
            port: 5432
            health: pg_isready -h 127.0.0.1 -U nexterm -d nexterm_test
            dsn: postgres://nexterm:nexterm@127.0.0.1:5432/nexterm_test?sslmode=disable
          - backend: mysql
            image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
            port: 3306
            health: mysqladmin ping --silent -h 127.0.0.1
            dsn: root:nexterm_root@tcp(127.0.0.1:3306)/nexterm_test?parseTime=true
          - backend: mariadb
            image: mariadb:11.4@sha256:250e1609e93c0e6aecf64bfbab2d84d5e89d2481540fe77447ff6c855c3b1873
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
            dsn: root:nexterm_root@tcp(127.0.0.1:3306)/nexterm_test?parseTime=true
          - backend: sqlite
            dsn: ""
    env:
      NEXTERM_TEST_DB_BACKEND: ${{ matrix.backend }}
      NEXTERM_TEST_DB_DSN: ${{ matrix.dsn }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restores the Go test job's build cache profile without writing a copy per backend.
      - uses: ./.github/actions/go-toolchain
        with:
          build-cache: test
          save-build-cache: "false"
      - name: Start the database container
        if: matrix.backend != 'sqlite'
        run: |
          docker run --detach --name nexterm-test-db \
            --publish "${{ matrix.port }}:${{ matrix.port }}" \
            --env POSTGRES_USER=nexterm \
            --env POSTGRES_PASSWORD=nexterm \
            --env POSTGRES_DB=nexterm_test \
            --env MYSQL_ROOT_HOST="%" \
            --env MYSQL_ROOT_PASSWORD=nexterm_root \
            --env MYSQL_USER=nexterm \
            --env MYSQL_PASSWORD=nexterm \
            --env MYSQL_DATABASE=nexterm_test \
            --env MARIADB_ROOT_HOST="%" \
            --env MARIADB_ROOT_PASSWORD=nexterm_root \
            --env MARIADB_USER=nexterm \
            --env MARIADB_PASSWORD=nexterm \
            --env MARIADB_DATABASE=nexterm_test \
            --health-cmd "${{ matrix.health }}" \
            --health-interval 5s \
            --health-timeout 5s \
            --health-retries 20 \
            "${{ matrix.image }}"
      - name: Install the pinned task runner
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.45.5
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Wait for the database container
        if: matrix.backend != 'sqlite'
        run: |
          for _ in {1..60}; do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' nexterm-test-db)"
            case "$status" in
              healthy)
                exit 0
                ;;
              unhealthy|dead|exited)
                docker logs nexterm-test-db
                exit 1
                ;;
            esac
            sleep 2
          done
          echo "database did not become healthy" >&2
          docker logs nexterm-test-db
          exit 1
      - name: Run the shared database contracts
        run: |
          if [ -n "$NEXTERM_TEST_DB_DSN" ]; then
            echo "::add-mask::$NEXTERM_TEST_DB_DSN"
          fi
          task test:database
      - name: Stop the database container
        if: always() && matrix.backend != 'sqlite'
        run: |
          if docker container inspect nexterm-test-db >/dev/null 2>&1; then
            docker rm --force --volumes nexterm-test-db
          fi

  native:
    name: ${{ matrix.os }}/${{ matrix.arch }} (${{ join(matrix.kinds, ', ') }})
    if: fromJSON(needs.version.outputs.scope).native
    needs: [frontend, version]
    timeout-minutes: 60
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      NEXTERM_ORT_VERSION: ${{ needs.version.outputs.ort-version }}
      GITHUB_TOKEN: ${{ github.token }}
      NEXTERM_RELEASE_REF: ${{ github.ref }}
      NEXTERM_MINISIGN_PUBLIC_KEY: ${{ inputs.updater_public_key }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.native-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux WebView prerequisites
        if: matrix.os == 'linux' && contains(matrix.kinds, 'desktop')
        uses: ./.github/actions/linux-gui-deps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - uses: ./.github/actions/go-toolchain
        with:
          build-cache: native
      - name: Restore ONNX Runtime downloads
        if: contains(matrix.kinds, 'desktop') || contains(matrix.kinds, 'server')
        uses: ./.github/actions/ort-cache
        with:
          version: ${{ needs.version.outputs.ort-version }}
          target: ${{ matrix.os }}-${{ matrix.arch }}
      - name: Verify Windows PowerShell runtimes
        if: github.event_name == 'pull_request' && fromJSON(needs.version.outputs.scope).unit && matrix.os == 'windows' && matrix.arch == 'amd64' && contains(matrix.kinds, 'desktop')
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "powershell.exe 5.x is required" }
          Write-Output ("powershell.exe " + $PSVersionTable.PSVersion.ToString())
          $pwshVersion = & pwsh.exe --version
          if ($LASTEXITCODE -ne 0 -or $pwshVersion -notmatch '^PowerShell 7\.') { throw "pwsh.exe 7.x version check failed" }
          Write-Output $pwshVersion
      - name: Run real Windows Go and loopback tests
        if: github.event_name == 'pull_request' && fromJSON(needs.version.outputs.scope).unit && matrix.os == 'windows' && matrix.arch == 'amd64' && contains(matrix.kinds, 'desktop')
        shell: powershell
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = 'Stop'
          & ./.github/scripts/windows-real-tests.ps1
      - name: Download the verified frontend dist
        if: contains(matrix.kinds, 'desktop')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: target/ci-work/verified-dist
      - name: Compile native platform tests without running TestMain
        if: github.event_name == 'pull_request' && fromJSON(needs.version.outputs.scope).unit && contains(matrix.kinds, 'desktop') && ((matrix.os == 'windows' && matrix.arch == 'amd64') || (matrix.os == 'darwin' && matrix.arch == 'arm64'))
        run: go run -mod=readonly ./scripts/compile-only ./...
      - name: Test desktop production embedding
        if: github.event_name == 'pull_request' && matrix.os == 'linux' && matrix.arch == 'amd64' && contains(matrix.kinds, 'desktop')
        env:
          DIST_SOURCE: target/ci-work/verified-dist/dist
          DIST_MANIFEST: target/ci-work/verified-dist/target/dist-manifest.json
        run: node scripts/test-production.mjs
      - name: Build production binaries and verify artifact evidence
        env:
          NATIVE_TARGET: ${{ toJSON(matrix) }}
          REPRO_CHECK: ${{ fromJSON(needs.version.outputs.scope).repro }}
        run: node .github/scripts/build-native.mjs
      # Loads the staged ONNX Runtime through purego and runs a generated
      # model, so an OrtApi slot or ABI mismatch fails before release.
      - name: Smoke-test the staged privacy runtime
        if: contains(matrix.kinds, 'desktop') || contains(matrix.kinds, 'server')
        env:
          CGO_ENABLED: "0"
          NEXTERM_PRIVACY_TEST_RUNTIME: ${{ github.workspace }}/target/go-build/ai-runtime-${{ matrix.os }}-${{ matrix.arch }}
        run: go test -count=1 -run '^(TestRuntimeLoaderErrorIsReported|TestRuntimeSmoke)$' -v ./internal/ai/privacy/inference/
      - name: Run Go two-process server acceptance
        if: contains(matrix.kinds, 'server')
        run: go run ./scripts/e2e-harness sync --bin target/go-build/nexterm-server-${{ matrix.os }}-${{ matrix.arch }} --no-build
      - name: Upload desktop binary and evidence
        if: ${{ !cancelled() && contains(matrix.kinds, 'desktop') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-desktop
          path: |
            target/go-build/nexterm-desktop-${{ matrix.os }}-${{ matrix.arch }}*
            target/go-build/ai-runtime-${{ matrix.os }}-${{ matrix.arch }}/
            target/e2e-sync/report.json
            target/e2e-sync/*.log
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Upload server binary and evidence
        if: ${{ !cancelled() && contains(matrix.kinds, 'server') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-server
          path: |
            target/go-build/nexterm-server-${{ matrix.os }}-${{ matrix.arch }}*
            target/go-build/ai-runtime-${{ matrix.os }}-${{ matrix.arch }}/
            target/e2e-sync/report.json
            target/e2e-sync/*.log
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Upload helper binary and evidence
        if: ${{ !cancelled() && contains(matrix.kinds, 'helper') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-helper
          path: |
            target/go-build/nexterm-helper-${{ matrix.os }}-${{ matrix.arch }}*
            target/e2e-sync/report.json
            target/e2e-sync/*.log
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Upload agent binary and evidence
        if: ${{ !cancelled() && contains(matrix.kinds, 'agent') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-agent
          path: |
            target/go-build/nexterm-agent-${{ matrix.os }}-${{ matrix.arch }}*
            target/e2e-sync/report.json
            target/e2e-sync/*.log
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  mobile-compile:
    name: Mobile Go compile (${{ matrix.platform }})
    needs: [frontend, version]
    if: fromJSON(needs.version.outputs.scope).mobile
    timeout-minutes: 60
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      NEXTERM_ORT_VERSION: ${{ needs.version.outputs.ort-version }}
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux libraries required by the Wails CLI
        if: matrix.platform == 'android'
        uses: ./.github/actions/linux-gui-deps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - uses: ./.github/actions/go-toolchain
        with:
          build-cache: mobile-${{ matrix.platform }}
      - name: Download the verified frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: target/ci-work/verified-dist
      - name: Verify the iOS toolchain
        if: matrix.platform == 'ios'
        run: xcodebuild -version
      - uses: ./.github/actions/wails-cli
      - name: Prepare Android production assets and overlay
        if: matrix.platform == 'android'
        env:
          DIST_SOURCE: target/ci-work/verified-dist/dist
          DIST_MANIFEST: target/ci-work/verified-dist/target/dist-manifest.json
        run: |
          wails3 task android:common:build:frontend
          wails3 task android:generate:android:overlay
      - name: Build and vet Android production packages
        if: matrix.platform == 'android'
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: "0"
        run: |
          go build -overlay build/android/overlay.json -tags android,production ./cmd/... ./internal/...
          go vet -overlay build/android/overlay.json -tags android,production ./cmd/... ./internal/...
      - name: Prepare iOS production assets and overlay
        if: matrix.platform == 'ios'
        env:
          DIST_SOURCE: target/ci-work/verified-dist/dist
          DIST_MANIFEST: target/ci-work/verified-dist/target/dist-manifest.json
        run: |
          wails3 task ios:common:build:frontend
          wails3 task ios:generate:ios:overlay
      - name: Build and vet iOS production packages
        if: matrix.platform == 'ios'
        env:
          GOOS: ios
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          SDK_PATH="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          export CGO_CFLAGS="-isysroot $SDK_PATH -target arm64-apple-ios15.0-simulator -mios-simulator-version-min=15.0"
          export CGO_LDFLAGS="-isysroot $SDK_PATH -target arm64-apple-ios15.0-simulator"
          go build -overlay build/ios/xcode/overlay.json -tags ios,production ./cmd/... ./internal/...
          go vet -tags ios,production ./cmd/... ./internal/...

  mobile:
    name: ${{ matrix.platform }} mobile
    needs: [frontend, version]
    if: github.event_name != 'pull_request'
    timeout-minutes: 60
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      NEXTERM_ORT_VERSION: ${{ needs.version.outputs.ort-version }}
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux libraries required by the Wails CLI
        if: matrix.platform == 'android'
        uses: ./.github/actions/linux-gui-deps
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Prepare Android release signing
        if: matrix.platform == 'android'
        env:
          NEXTERM_ANDROID_KEYSTORE_BASE64: ${{ secrets.NEXTERM_ANDROID_KEYSTORE_BASE64 }}
        run: bash build/android/scripts/setup-signing.sh
      - uses: ./.github/actions/go-toolchain
        with:
          build-cache: mobile-${{ matrix.platform }}
      - name: Restore ONNX Runtime downloads
        uses: ./.github/actions/ort-cache
        with:
          version: ${{ needs.version.outputs.ort-version }}
          target: ${{ matrix.platform == 'android' && 'android-arm64' || 'ios' }}
      - name: Download the verified frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: target/ci-work/verified-dist
      - name: Resolve the Android SDK root
        if: matrix.platform == 'android'
        id: android-sdk-root
        run: echo "home=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
      - name: Restore the Android NDK cache
        if: matrix.platform == 'android'
        id: android-sdk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.android-sdk-root.outputs.home }}/ndk/26.3.11579264
          key: android-sdk-v1-ndk-26.3.11579264
      - name: Install Android SDK packages and a missing NDK
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          if [ "${{ steps.android-sdk-cache.outputs.cache-hit }}" != "true" ]; then
            "$SDKMANAGER" "ndk;26.3.11579264"
          fi
      - name: Install Java 21
        if: matrix.platform == 'android'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Verify the iOS toolchain
        if: matrix.platform == 'ios'
        run: xcodebuild -version
      - uses: ./.github/actions/wails-cli
      - name: Build the mobile package
        env:
          DIST_SOURCE: target/ci-work/verified-dist/dist
          DIST_MANIFEST: target/ci-work/verified-dist/target/dist-manifest.json
          NEXTERM_ANDROID_SIGNING_REQUIRED: ${{ matrix.platform == 'android' && 'true' || 'false' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ matrix.platform == 'android' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: wails3 task ${{ matrix.platform }}:package
      - name: Verify Android release evidence
        if: matrix.platform == 'android' && env.NEXTERM_RELEASE_VERSION != ''
        env:
          NEXTERM_ANDROID_CERT_SHA256: ${{ vars.NEXTERM_ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f -perm -u+x | sort -V | tail -1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f -perm -u+x | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ] || [ -z "$AAPT2" ]; then
            echo "apksigner and aapt2 are required in Android SDK build-tools for release evidence" >&2
            exit 1
          fi
          "$APKSIGNER" --version
          "$AAPT2" version
          go run ./scripts/mobile-evidence bin/nexterm.apk mobile-android
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("bin/nexterm.apk.artifact.json", "utf8"));
            const unverified = report.assertions.filter((assertion) => assertion.status !== "passed");
            if (unverified.length > 0) {
              console.error("Android evidence contains unverified assertions: " + unverified.map((assertion) => `${assertion.id}=${assertion.status}`).join(", "));
              process.exit(1);
            }
          '
      - name: Upload the mobile package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-${{ matrix.platform }}
          path: bin/${{ matrix.platform == 'android' && 'nexterm.apk' || 'nexterm.app' }}
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Remove Android signing material
        if: always() && matrix.platform == 'android'
        run: rm -f "$RUNNER_TEMP/nexterm-android-release.keystore"

  ios-dist:
    name: iOS App Store signed IPA
    needs: [frontend, version]
    if: vars.NEXTERM_IOS_SIGNING == 'true' && inputs.release_version != ''
    runs-on: macos-26
    timeout-minutes: 60
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      NEXTERM_ORT_VERSION: ${{ needs.version.outputs.ort-version }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - uses: ./.github/actions/go-toolchain
        with:
          build-cache: mobile-ios
      - name: Restore ONNX Runtime downloads
        uses: ./.github/actions/ort-cache
        with:
          version: ${{ needs.version.outputs.ort-version }}
          target: ios
      - name: Download the verified frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: target/ci-work/verified-dist
      - name: Verify the iOS toolchain
        run: xcodebuild -version
      - uses: ./.github/actions/wails-cli
      - name: Import and validate iOS App Store signing
        env:
          P12_BASE64: ${{ secrets.NEXTERM_IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.NEXTERM_IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.NEXTERM_IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "NEXTERM_IOS_SIGNING requires NEXTERM_IOS_P12_BASE64 and NEXTERM_IOS_PROVISIONING_PROFILE" >&2
            exit 1
          fi
          umask 077
          P12="$RUNNER_TEMP/nexterm-ios-signing.p12"
          PROFILE="$RUNNER_TEMP/nexterm.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/nexterm-profile.plist"
          KEYCHAIN="$RUNNER_TEMP/nexterm-ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "$P12_BASE64" | base64 --decode > "$P12"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" -o "$PROFILE_PLIST"
          for key in ProvisionedDevices ProvisionsAllDevices; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PROFILE_PLIST" >/dev/null 2>&1; then
              echo "an App Store provisioning profile is required; development, ad-hoc and enterprise profiles cannot be uploaded to TestFlight" >&2
              exit 1
            fi
          done
          GET_TASK_ALLOW="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST" 2>/dev/null || true)"
          if [ "$GET_TASK_ALLOW" != "false" ]; then
            echo "the App Store provisioning profile must set get-task-allow to false" >&2
            exit 1
          fi
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          APPLICATION_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          if [ "$APPLICATION_IDENTIFIER" != "$TEAM_ID.work.nexterm.app" ]; then
            echo "the provisioning profile application identifier must be $TEAM_ID.work.nexterm.app" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$PROFILE_PLIST" > "$RUNNER_TEMP/nexterm-distribution-entitlements.plist"
          plutil -lint "$RUNNER_TEMP/nexterm-distribution-entitlements.plist"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "Apple Distribution"
      - name: Build the signed iOS distribution IPA
        env:
          DIST_SOURCE: target/ci-work/verified-dist/dist
          IOS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          CODESIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE: ${{ runner.temp }}/nexterm.mobileprovision
          ENTITLEMENTS_FILE: ${{ runner.temp }}/nexterm-distribution-entitlements.plist
        run: wails3 task ios:package:ipa IOS_PLATFORM=device
      - name: Verify the signed iOS distribution IPA
        run: |
          set -euo pipefail
          APP=bin/nexterm.app
          IPA=bin/nexterm.ipa
          test -f "$APP/embedded.mobileprovision"
          cmp "$RUNNER_TEMP/nexterm.mobileprovision" "$APP/embedded.mobileprovision"
          plutil -lint "$APP/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -F "Authority=Apple Distribution"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/nexterm-signed-entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$RUNNER_TEMP/nexterm-signed-entitlements.plist")" = "false"
          unzip -Z1 "$IPA" | grep -Fx "Payload/nexterm.app/embedded.mobileprovision"
      - name: Upload the iOS distribution IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-ios-dist
          path: bin/nexterm.ipa
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Remove iOS signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/nexterm-ios-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/nexterm-ios-signing.p12" "$RUNNER_TEMP/nexterm.mobileprovision" "$RUNNER_TEMP/nexterm-profile.plist" "$RUNNER_TEMP/nexterm-distribution-entitlements.plist" "$RUNNER_TEMP/nexterm-signed-entitlements.plist"

  ci-ok:
    name: ci-ok
    if: always()
    needs:
      - version
      - frontend
      - frontend-lint
      - frontend-test
      - frontend-coverage
      - quality
      - unit
      - database
      - native
      - mobile-compile
      - mobile
      - ios-dist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject failed, cancelled, or unexpectedly skipped CI jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          SCOPE: ${{ needs.version.outputs.scope }}
          IOS_SIGNING: ${{ vars.NEXTERM_IOS_SIGNING }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          node --input-type=module -e '
            const results = JSON.parse(process.env.NEEDS);
            const event = process.env.EVENT_NAME || "";
            const release = (process.env.RELEASE_VERSION || "") !== "";
            const iosSigning = process.env.IOS_SIGNING === "true";
            const scope = JSON.parse(process.env.SCOPE);
            const skipAllowed = {
              quality: !scope.quality,
              unit: !scope.unit,
              database: !scope.database,
              frontend: !scope.frontend,
              "frontend-lint": !scope.frontendTests,
              "frontend-test": !scope.frontendTests,
              "frontend-coverage": !scope.frontendTests,
              native: !scope.native,
              "mobile-compile": !scope.mobile,
              mobile: event === "pull_request",
              "ios-dist": !(iosSigning && release),
            };
            for (const [name, { result }] of Object.entries(results)) {
              console.log(`${name}: ${result}`);
            }
            const rejected = Object.entries(results).filter(([, { result }]) => result !== "success" && result !== "skipped");
            if (rejected.length > 0) {
              console.error("CI jobs failed or were cancelled: " + rejected.map(([name, { result }]) => `${name}=${result}`).join(", "));
              process.exit(1);
            }
            const unexpectedSkips = Object.entries(results)
              .filter(([name, { result }]) => result === "skipped" && !skipAllowed[name]);
            if (unexpectedSkips.length > 0) {
              console.error("CI jobs skipped unexpectedly for event " + event + ": " + unexpectedSkips.map(([name]) => `${name}=skipped`).join(", "));
              process.exit(1);
            }
          '
