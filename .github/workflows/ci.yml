name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "website/**"
      - ".github/workflows/pages.yml"
      - "**.md"
  pull_request:
    paths-ignore:
      - "website/**"
      - ".github/workflows/pages.yml"
      - "**.md"
  workflow_call:
    inputs:
      release_version:
        description: "Release version stamped into artifacts (without the leading v); empty means the wails.json placeholder"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.26.8
  GOFLAGS: -mod=readonly

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      native-matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: matrix
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const entries = JSON.parse(fs.readFileSync(".github/native-matrix.json", "utf8"));
            const include = entries.filter((entry) => process.env.IS_PR !== "true" || entry.smoke);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${JSON.stringify({ include })}\n`);
          '
      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          raw="$INPUT_VERSION"
          if [ -z "$raw" ] && [ "$REF_TYPE" = "tag" ]; then raw="$REF_NAME"; fi
          version="${raw#v}"
          if [ -n "$version" ] && ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  frontend:
    name: Reproducible frontend
    needs: version
    runs-on: ubuntu-latest
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend lint
        run: pnpm lint
      - name: Frontend tests
        run: pnpm test
      - name: Reproducible real frontend
        run: node scripts/build.mjs frontend --repro-check
      - name: Upload the verified frontend dist and manifest
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: |
            dist/
            target/dist-manifest.json
          if-no-files-found: error

  quality:
    name: Go/Wails quality gates
    needs: [version, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Install Linux Wails cgo prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Restore the pinned Wails CLI
        id: wails-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: wails3-v3.0.0-beta.27-${{ runner.os }}-${{ runner.arch }}-go1.26.8
      - name: Install the pinned Wails CLI
        run: |
          if [ "${{ steps.wails-cache.outputs.cache-hit }}" != "true" ]; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails3 version
      - name: Go static quality gates
        run: |
          wails3 task fmt:check
          wails3 task vet
          go mod verify
          go run ./scripts/verify-manifest-injects
      - name: Release script and artifact behavior
        run: wails3 task check:scripts
      - name: Wails bindings drift
        run: node scripts/build.mjs bindings

  database:
    name: Database contracts (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: postgres
            image: postgres:16
            port: 5432
            health: pg_isready -U nexterm -d nexterm_test
            dsn: postgres://nexterm:nexterm@127.0.0.1:5432/nexterm_test?sslmode=disable
          - backend: mysql
            image: mysql:8.4
            port: 3306
            health: mysqladmin ping --silent -h 127.0.0.1
            dsn: root:nexterm_root@tcp(127.0.0.1:3306)/nexterm_test?parseTime=true
          - backend: mariadb
            image: mariadb:11.4
            port: 3306
            health: healthcheck.sh --connect --innodb_initialized
            dsn: root:nexterm_root@tcp(127.0.0.1:3306)/nexterm_test?parseTime=true
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: nexterm
          POSTGRES_PASSWORD: nexterm
          POSTGRES_DB: nexterm_test
          MYSQL_ROOT_HOST: "%"
          MYSQL_ROOT_PASSWORD: nexterm_root
          MYSQL_USER: nexterm
          MYSQL_PASSWORD: nexterm
          MYSQL_DATABASE: nexterm_test
          MARIADB_ROOT_HOST: "%"
          MARIADB_ROOT_PASSWORD: nexterm_root
          MARIADB_USER: nexterm
          MARIADB_PASSWORD: nexterm
          MARIADB_DATABASE: nexterm_test
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.health }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NEXTERM_TEST_DB_BACKEND: ${{ matrix.backend }}
      NEXTERM_TEST_DB_DSN: ${{ matrix.dsn }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Install the pinned task runner
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.45.5
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run the shared database contracts
        run: |
          echo "::add-mask::$NEXTERM_TEST_DB_DSN"
          task test:database

  native:
    name: ${{ matrix.os }}/${{ matrix.arch }} ${{ matrix.kind }}
    needs: [frontend, version]
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.native-matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Verify Windows PowerShell runtimes
        if: matrix.os == 'windows' && matrix.arch == 'amd64' && matrix.kind == 'desktop'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoLogo -NoProfile -NonInteractive -Command 'Write-Output ("powershell.exe " + $PSVersionTable.PSVersion.ToString())'
          if ($LASTEXITCODE -ne 0) { throw "powershell.exe version check failed" }
          & pwsh.exe -NoLogo -NoProfile -NonInteractive -Command 'Write-Output ("pwsh.exe " + $PSVersionTable.PSVersion.ToString())'
          if ($LASTEXITCODE -ne 0) { throw "pwsh.exe version check failed" }
      - name: Run real Windows Go and loopback tests
        if: matrix.os == 'windows' && matrix.arch == 'amd64' && matrix.kind == 'desktop'
        shell: powershell
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = 'Stop'
          & ./.github/scripts/windows-real-tests.ps1
      - name: Download the verified frontend dist
        if: matrix.kind == 'desktop'
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: verified-dist
      - name: Install Linux WebView prerequisites
        if: matrix.os == 'linux' && matrix.kind == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Build the repro-checked production binary and inspect format/cgo/size evidence
        run: node scripts/build.mjs ${{ matrix.kind }} --release --repro-check ${{ matrix.kind == 'desktop' && '--consume-dist=verified-dist/dist --dist-manifest=verified-dist/target/dist-manifest.json' || '' }} --os=${{ matrix.os }} --arch=${{ matrix.arch }}
      - name: Run Go two-process server acceptance
        if: matrix.kind == 'server'
        run: go run ./scripts/e2e-harness sync --bin target/go-build/nexterm-server-${{ matrix.os }}-${{ matrix.arch }} --no-build
      - name: Upload native runtime, production binary and artifact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.kind }}
          path: |
            target/go-build/*.artifact.json
            target/go-build/*.manifest.json
            target/go-build/nexterm-${{ matrix.kind }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}
            target/e2e-sync/report.json
            target/e2e-sync/*.log
          if-no-files-found: error

  mobile:
    name: ${{ matrix.platform }} mobile
    needs: [frontend, version]
    if: github.event_name != 'pull_request'
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Download the verified frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: verified-dist
      - name: Resolve the Android SDK root
        if: matrix.platform == 'android'
        id: android-sdk-root
        run: echo "home=$ANDROID_HOME" >> "$GITHUB_OUTPUT"
      - name: Restore the Android NDK cache
        if: matrix.platform == 'android'
        id: android-sdk-cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.android-sdk-root.outputs.home }}/ndk/26.3.11579264
          key: android-sdk-v1-ndk-26.3.11579264
      - name: Install the Android SDK
        if: matrix.platform == 'android' && steps.android-sdk-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
      - name: Install Java 21
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Verify the iOS toolchain
        if: matrix.platform == 'ios'
        run: xcodebuild -version
      - name: Install Linux Wails cgo prerequisites
        if: matrix.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Restore the pinned Wails CLI
        id: wails-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: wails3-v3.0.0-beta.27-${{ runner.os }}-${{ runner.arch }}-go1.26.8
      - name: Install the pinned Wails CLI
        run: |
          if [ "${{ steps.wails-cache.outputs.cache-hit }}" != "true" ]; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails3 version
      - name: Stamp the mobile version
        run: |
          node -e '
            const fs = require("node:fs");
            const version = process.env.NEXTERM_RELEASE_VERSION;
            if (version) {
              const path = "build/config.yml";
              const text = fs.readFileSync(path, "utf8");
              fs.writeFileSync(path, text.replace(/version: "0\.0\.0"/g, `version: "${version}"`));
            }
          '
      - name: Build the mobile package
        env:
          DIST_SOURCE: verified-dist/dist
        run: wails3 task ${{ matrix.platform }}:package
      - name: Upload the mobile package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-${{ matrix.platform }}
          path: bin/${{ matrix.platform == 'android' && 'nexterm.apk' || 'nexterm.app' }}
          if-no-files-found: error

  ios-dist:
    name: iOS App Store signed IPA
    needs: [quality, frontend, version]
    if: ${{ !failure() && !cancelled() && github.event_name == 'push' && vars.NEXTERM_IOS_SIGNING == 'true' }}
    runs-on: macos-15
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Download the verified frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: verified-dist
      - name: Verify the iOS toolchain
        run: xcodebuild -version
      - name: Restore the pinned Wails CLI
        id: wails-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: wails3-v3.0.0-beta.27-${{ runner.os }}-${{ runner.arch }}-go1.26.8
      - name: Install the pinned Wails CLI
        run: |
          if [ "${{ steps.wails-cache.outputs.cache-hit }}" != "true" ]; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails3 version
      - name: Import and validate iOS App Store signing
        env:
          P12_BASE64: ${{ secrets.NEXTERM_IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.NEXTERM_IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.NEXTERM_IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "NEXTERM_IOS_SIGNING requires NEXTERM_IOS_P12_BASE64 and NEXTERM_IOS_PROVISIONING_PROFILE" >&2
            exit 1
          fi
          umask 077
          P12="$RUNNER_TEMP/nexterm-ios-signing.p12"
          PROFILE="$RUNNER_TEMP/nexterm.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/nexterm-profile.plist"
          KEYCHAIN="$RUNNER_TEMP/nexterm-ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "$P12_BASE64" | base64 --decode > "$P12"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" -o "$PROFILE_PLIST"
          for key in ProvisionedDevices ProvisionsAllDevices; do
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PROFILE_PLIST" >/dev/null 2>&1; then
              echo "an App Store provisioning profile is required; development, ad-hoc and enterprise profiles cannot be uploaded to TestFlight" >&2
              exit 1
            fi
          done
          GET_TASK_ALLOW="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PROFILE_PLIST" 2>/dev/null || true)"
          if [ "$GET_TASK_ALLOW" != "false" ]; then
            echo "the App Store provisioning profile must set get-task-allow to false" >&2
            exit 1
          fi
          TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PROFILE_PLIST")"
          APPLICATION_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          if [ "$APPLICATION_IDENTIFIER" != "$TEAM_ID.com.nexterm.desktop" ]; then
            echo "the provisioning profile application identifier must be $TEAM_ID.com.nexterm.desktop" >&2
            exit 1
          fi
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$PROFILE_PLIST" > "$RUNNER_TEMP/nexterm-distribution-entitlements.plist"
          plutil -lint "$RUNNER_TEMP/nexterm-distribution-entitlements.plist"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -F "Apple Distribution"
      - name: Stamp the mobile version
        run: |
          node -e '
            const fs = require("node:fs");
            const version = process.env.NEXTERM_RELEASE_VERSION;
            if (version) {
              const path = "build/config.yml";
              const text = fs.readFileSync(path, "utf8");
              fs.writeFileSync(path, text.replace(/version: "0\.0\.0"/g, `version: "${version}"`));
            }
          '
      - name: Build the signed iOS distribution IPA
        env:
          DIST_SOURCE: verified-dist/dist
          IOS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
          CODESIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE: ${{ runner.temp }}/nexterm.mobileprovision
          ENTITLEMENTS_FILE: ${{ runner.temp }}/nexterm-distribution-entitlements.plist
        run: wails3 task ios:package:ipa IOS_PLATFORM=device
      - name: Verify the signed iOS distribution IPA
        run: |
          set -euo pipefail
          APP=bin/nexterm.app
          IPA=bin/nexterm.ipa
          test -f "$APP/embedded.mobileprovision"
          cmp "$RUNNER_TEMP/nexterm.mobileprovision" "$APP/embedded.mobileprovision"
          plutil -lint "$APP/Info.plist"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvvv "$APP" 2>&1 | grep -F "Authority=Apple Distribution"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/nexterm-signed-entitlements.plist" 2>/dev/null
          test "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' "$RUNNER_TEMP/nexterm-signed-entitlements.plist")" = "false"
          unzip -Z1 "$IPA" | grep -Fx "Payload/nexterm.app/embedded.mobileprovision"
      - name: Upload the iOS distribution IPA
        uses: actions/upload-artifact@v7
        with:
          name: mobile-ios-dist
          path: bin/nexterm.ipa
          if-no-files-found: error
      - name: Remove iOS signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/nexterm-ios-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/nexterm-ios-signing.p12" "$RUNNER_TEMP/nexterm.mobileprovision" "$RUNNER_TEMP/nexterm-profile.plist" "$RUNNER_TEMP/nexterm-distribution-entitlements.plist" "$RUNNER_TEMP/nexterm-signed-entitlements.plist"
