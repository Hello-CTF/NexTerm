name: CI

on:
  push:
    branches: [master, main, rwig]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.26.8
  GOFLAGS: -mod=readonly
  pnpm_config_minimum_release_age: 0

jobs:
  quality:
    name: Go/Wails quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Install Linux Wails cgo prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Restore the pinned Wails CLI
        id: wails-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: wails3-v3.0.0-beta.27-${{ runner.os }}-${{ runner.arch }}-go1.26.8
      - name: Install the pinned Wails CLI
        run: |
          if [ "${{ steps.wails-cache.outputs.cache-hit }}" != "true" ]; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          wails3 version
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --config.minimumReleaseAge=0
      - name: Install manifest verifier dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify the selected toolchain and modules
        run: |
          test "$(go env GOVERSION)" = "go1.26.8"
          go mod verify
      - name: Go formatting
        shell: bash
        run: |
          files="$(gofmt -l ./cmd ./internal ./migrations)"
          if [ -n "$files" ]; then printf 'gofmt required:\n%s\n' "$files"; exit 1; fi
      - name: Go vet
        run: go vet -mod=readonly ./...
      - name: Go tests
        run: go test -mod=readonly ./...
      - name: Frontend lint and tests
        run: |
          pnpm lint
          pnpm test
      - name: Wails bindings drift
        run: node scripts/build.mjs bindings
      - name: Reproducible real frontend
        run: node scripts/build.mjs frontend --repro-check
      - name: Go self-consistency and LazyCat static contracts
        run: |
          python3 -m unittest discover -s tests/parity -v
          python3 scripts/verify-manifest-injects.py
      - name: Workflow reuse wiring checks
        env:
          SOURCE_DATE_EPOCH: "1"
        run: python3 .github/scripts/check-reuse-wiring.py
      - name: Upload the verified frontend dist and manifest
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: |
            dist/
            target/dist-manifest.json
          if-no-files-found: error

  native:
    name: ${{ matrix.os }}/${{ matrix.arch }} ${{ matrix.kind }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: amd64
            kind: desktop
          - runner: windows-11-arm
            os: windows
            arch: arm64
            kind: desktop
          - runner: macos-15
            os: darwin
            arch: arm64
            kind: desktop
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            kind: desktop
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            kind: desktop
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            kind: desktop
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            kind: server
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            kind: server
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Download the verified frontend dist
        if: matrix.kind == 'desktop'
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: verified-dist
      - name: Install Linux WebView prerequisites
        if: matrix.os == 'linux' && matrix.kind == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Build the repro-checked production binary and inspect format/cgo/size evidence
        run: node scripts/build.mjs ${{ matrix.kind }} --release --repro-check ${{ matrix.kind == 'desktop' && '--consume-dist=verified-dist/dist --dist-manifest=verified-dist/target/dist-manifest.json' || '' }} --os=${{ matrix.os }} --arch=${{ matrix.arch }}
      - name: Run Go two-process server acceptance
        if: matrix.kind == 'server'
        run: python3 scripts/e2e-sync-local.py --bin target/go-build/nexterm-server-${{ matrix.os }}-${{ matrix.arch }} --no-build
      - name: Upload native runtime, production binary and artifact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.kind }}
          path: |
            target/go-build/*.artifact.json
            target/go-build/*.manifest.json
            target/go-build/nexterm-${{ matrix.kind }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}
            target/e2e-sync/report.json
            target/e2e-sync/*.log
          if-no-files-found: error
