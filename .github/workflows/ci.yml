name: CI

on:
  push:
    branches: [master, main, rwig]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.26.8
  GOFLAGS: -mod=readonly

jobs:
  quality:
    name: Go/Wails quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: true
      - name: Install the pinned Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.98
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install manifest verifier dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify the selected toolchain and modules
        run: |
          test "$(go env GOVERSION)" = "go1.26.8"
          go mod verify
      - name: Go formatting
        shell: bash
        run: |
          files="$(gofmt -l ./cmd ./internal ./migrations)"
          if [ -n "$files" ]; then printf 'gofmt required:\n%s\n' "$files"; exit 1; fi
      - name: Go vet
        run: go vet -mod=readonly ./...
      - name: Go tests
        run: go test -mod=readonly ./...
      - name: Go race tests
        run: go test -mod=readonly -race ./...
      - name: Frontend typecheck, lint and tests
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
      - name: Wails bindings drift
        run: node scripts/build.mjs bindings
      - name: Reproducible real frontend
        run: node scripts/build.mjs frontend --repro-check
      - name: Go self-consistency and LazyCat static contracts
        run: |
          python3 -m unittest discover -s tests/parity -v
          python3 scripts/verify-manifest-injects.py

  native:
    name: ${{ matrix.os }}/${{ matrix.arch }} ${{ matrix.kind }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: amd64
            kind: desktop
          - runner: macos-15
            os: darwin
            arch: arm64
            kind: desktop
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            kind: desktop
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            kind: desktop
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            kind: server
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            kind: server
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Linux WebView and virtual display
        if: matrix.os == 'linux' && matrix.kind == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - name: Build stripped native artifact and inspect format/cgo/size evidence
        run: node scripts/build.mjs ${{ matrix.kind }} --release --repro-check --os=${{ matrix.os }} --arch=${{ matrix.arch }} ${{ matrix.kind == 'desktop' && '--smoke' || '' }}
      - name: Run Go two-process server acceptance
        if: matrix.kind == 'server'
        run: python3 scripts/e2e-sync-local.py --bin target/go-build/nexterm-server-${{ matrix.os }}-${{ matrix.arch }} --no-build
      - name: Upload native runtime and artifact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.kind }}
          path: |
            target/go-build/*.artifact.json
            target/release-assets/desktop-smoke-*.json
            target/e2e-sync/report.json
            target/e2e-sync/*.log
          if-no-files-found: error

  browser:
    name: Real Chromium responsive and WS acceptance
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Require a real browser
        run: google-chrome --version
      - name: Run real-browser acceptance
        run: node .github/scripts/browser-acceptance.mjs
      - name: Upload browser evidence and explicit real-target gaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-browser-acceptance
          path: target/acceptance-browser/
          if-no-files-found: error
