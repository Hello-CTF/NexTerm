name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "website/**"
      - ".github/workflows/pages.yml"
      - "**.md"
  pull_request:
  workflow_call:
    inputs:
      release_version:
        description: "Release version stamped into artifacts (without the leading v); empty means the wails.json placeholder"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: go1.26.8
  GOFLAGS: -mod=readonly

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.release_version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          raw="$INPUT_VERSION"
          if [ -z "$raw" ] && [ "$REF_TYPE" = "tag" ]; then raw="$REF_NAME"; fi
          version="${raw#v}"
          if [ -n "$version" ] && ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  quality:
    name: Go/Wails quality gates
    needs: version
    runs-on: ubuntu-latest
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Install Linux Wails cgo prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Restore the pinned Wails CLI
        id: wails-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: wails3-v3.0.0-beta.27-${{ runner.os }}-${{ runner.arch }}-go1.26.8
      - name: Install the pinned Wails CLI
        run: |
          if [ "${{ steps.wails-cache.outputs.cache-hit }}" != "true" ]; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          wails3 version
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify the selected toolchain and modules
        run: |
          test "$(go env GOVERSION)" = "go1.26.8"
          go mod verify
      - name: Go formatting
        shell: bash
        run: |
          files="$(gofmt -l ./cmd ./internal ./migrations ./scripts)"
          if [ -n "$files" ]; then printf 'gofmt required:\n%s\n' "$files"; exit 1; fi
      - name: Go vet
        run: go vet -mod=readonly ./...
      - name: Go tests
        run: go test -mod=readonly ./...
      - name: Frontend lint and tests
        run: |
          pnpm lint
          pnpm test
      - name: Wails bindings drift
        run: node scripts/build.mjs bindings
      - name: Reproducible real frontend
        run: node scripts/build.mjs frontend --repro-check
      - name: LazyCat manifest injects
        run: go run ./scripts/verify-manifest-injects
      - name: Workflow reuse wiring checks
        env:
          SOURCE_DATE_EPOCH: "1"
        run: go run ./scripts/check-reuse-wiring
      - name: Upload the verified frontend dist and manifest
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: |
            dist/
            target/dist-manifest.json
          if-no-files-found: error

  postgres:
    name: Real PostgreSQL 16 gated tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexterm
          POSTGRES_PASSWORD: nexterm
          POSTGRES_DB: nexterm_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U nexterm -d nexterm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXTERM_TEST_PG_DSN: postgres://nexterm:nexterm@127.0.0.1:55432/nexterm_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Mask the PostgreSQL service DSN
        run: |
          echo "::add-mask::$NEXTERM_TEST_PG_DSN"
          echo "::add-mask::nexterm:nexterm"
      - name: Run the PostgreSQL-gated dbtest, store, account, sync and cron suites
        run: |
          set -o pipefail
          go test -mod=readonly -count=1 -v ./internal/dbtest ./internal/store ./internal/account ./internal/sync ./internal/ai/cron | tee "$RUNNER_TEMP/pg-gated.log"
      - name: Reject skipped PostgreSQL tests
        run: |
          if grep -E '^(--- SKIP: .*Postgres|.*set NEXTERM_TEST_PG_DSN)' "$RUNNER_TEMP/pg-gated.log"; then
            echo "PostgreSQL tests must run for real in CI; SKIP is not a pass" >&2
            exit 1
          fi

  native:
    name: ${{ matrix.os }}/${{ matrix.arch }} ${{ matrix.kind }}
    needs: [quality, version]
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: amd64
            kind: desktop
          - runner: windows-11-arm
            os: windows
            arch: arm64
            kind: desktop
          - runner: macos-15
            os: darwin
            arch: arm64
            kind: desktop
          - runner: macos-15-intel
            os: darwin
            arch: amd64
            kind: desktop
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            kind: desktop
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            kind: desktop
          - runner: ubuntu-latest
            os: linux
            arch: amd64
            kind: server
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            kind: server
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Download the verified frontend dist
        if: matrix.kind == 'desktop'
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: verified-dist
      - name: Install Linux WebView prerequisites
        if: matrix.os == 'linux' && matrix.kind == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Build the repro-checked production binary and inspect format/cgo/size evidence
        run: node scripts/build.mjs ${{ matrix.kind }} --release --repro-check ${{ matrix.kind == 'desktop' && '--consume-dist=verified-dist/dist --dist-manifest=verified-dist/target/dist-manifest.json' || '' }} --os=${{ matrix.os }} --arch=${{ matrix.arch }}
      - name: Run Go two-process server acceptance
        if: matrix.kind == 'server'
        run: go run ./scripts/e2e-harness sync --bin target/go-build/nexterm-server-${{ matrix.os }}-${{ matrix.arch }} --no-build
      - name: Upload native runtime, production binary and artifact evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.kind }}
          path: |
            target/go-build/*.artifact.json
            target/go-build/*.manifest.json
            target/go-build/nexterm-${{ matrix.kind }}-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}
            target/e2e-sync/report.json
            target/e2e-sync/*.log
          if-no-files-found: error

  mobile:
    name: ${{ matrix.platform }} mobile
    needs: [quality, version]
    env:
      NEXTERM_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Download the verified frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: verified-dist
      - name: Install the Android SDK
        if: matrix.platform == 'android'
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
      - name: Install Java 21
        if: matrix.platform == 'android'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Verify the iOS toolchain
        if: matrix.platform == 'ios'
        run: xcodebuild -version
      - name: Restore the pinned Wails CLI
        id: wails-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: wails3-v3.0.0-beta.27-${{ runner.os }}-${{ runner.arch }}-go1.26.8
      - name: Install the pinned Wails CLI
        run: |
          if [ "${{ steps.wails-cache.outputs.cache-hit }}" != "true" ]; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          wails3 version
      - name: Stamp the mobile version
        run: |
          node -e '
            const fs = require("node:fs");
            const version = process.env.NEXTERM_RELEASE_VERSION;
            if (version) {
              const path = "build/config.yml";
              const text = fs.readFileSync(path, "utf8");
              fs.writeFileSync(path, text.replace(/version: "0\.0\.0"/g, `version: "${version}"`));
            }
          '
      - name: Build the mobile package
        env:
          DIST_SOURCE: verified-dist/dist
        run: wails3 task ${{ matrix.platform }}:package
      - name: Upload the mobile package
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-${{ matrix.platform }}
          path: bin/${{ matrix.platform == 'android' && 'nexterm.apk' || 'nexterm.app' }}
          if-no-files-found: error
