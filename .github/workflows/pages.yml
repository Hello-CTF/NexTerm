name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build reproducible demo assets through the shared Go/Wails delivery entry
        run: node scripts/build.mjs frontend --repro-check --base=/NexTerm/demo/
      - name: Assemble site without claiming deployed-target acceptance
        run: |
          mkdir -p _site
          cp -r website/. _site/
          cp -r dist _site/demo
          mkdir -p _site/images _site/brand
          cp website/images/*.png _site/images/
          cp public/brand/nexterm-mark-128.png _site/brand/
          cp .github/acceptance/real-target-gaps.json _site/acceptance-evidence-gaps.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Deployed URL remains an M47 real-target acceptance input
        run: echo "${{ steps.deployment.outputs.page_url }} deployed; run M47 real-target acceptance before marking deployed Pages passed"
