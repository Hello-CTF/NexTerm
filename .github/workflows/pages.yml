name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 与 ci.yml / release.yml / 锁文件保持同一口径（原为 9，与 pnpm-workspace.yaml
          # 里按 pnpm 11 写的依赖构建白名单对不上）。
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Build web app
        run: pnpm exec vite build --base=/NexTerm/demo/

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r website/. _site/
          cp -r dist _site/demo
          mkdir -p _site/images _site/brand
          cp docs/images/*.png _site/images/
          cp public/brand/nexterm-mark-128.png _site/brand/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
