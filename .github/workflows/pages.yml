name: Deploy Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site without claiming deployed-target acceptance
        run: |
          mkdir -p _site
          cp -r website/. _site/
          mkdir -p _site/brand
          cp public/brand/nexterm-mark-128.png _site/brand/
          cp .github/acceptance/real-target-gaps.json _site/acceptance-evidence-gaps.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
