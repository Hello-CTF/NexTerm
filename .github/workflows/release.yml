name: Release

# 打 `v*` tag 即出安装包并挂到 Release。
#
# 为什么必须在 CI 里出包：**Tauri 不能跨平台打包** —— NSIS 只能在 Windows 出，
# .app/.dmg 只能在 macOS 出。一台机器出一个平台，用矩阵各出一份。
on:
  push:
    tags: ["v*"]
# 刻意不挂 workflow_dispatch：手动触发时 github.ref_name 是**分支名**而不是 tag，
# tauri-action 会照着分支名去建 Release。要试流水线就推一个预发布 tag（如 v0.1.2-rc1）。

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.os }} · 出包
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # 平台覆盖文件 tauri.macos.conf.json 会自动合并（app + dmg + icon.icns）。
            args: "--bundles app,dmg"
          - os: windows-latest
            # tauri.conf.json 的基线 targets 就是 nsis + icon.ico。
            args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # Release 说明 = 本版更新内容 + 安装说明。
      #
      # 本版更新内容放 `docs/releases/<tag>.md`（如 v0.1.3.md）：发版时**只加一个文件**，
      # 不用改 workflow。此前 releaseBody 是硬编码的，于是每个 Release 都只有安装说明，
      # 下载页永远看不到「这一版改了什么」。
      #
      # 说明文件缺失时只出安装说明并打 warning —— 不阻断发版（漏写说明不该让产物出不来）。
      - name: 组装 Release 说明
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          body="release-body.md"
          if [[ -f "$notes" ]]; then
            echo "采用本版说明：$notes"
            cat "$notes" > "$body"
            printf '\n---\n\n' >> "$body"
          else
            echo "::warning::$notes 不存在，本次 Release 只有安装说明"
            : > "$body"
          fi
          cat .github/release-template.md >> "$body"
          # 多行值必须用「name<<分隔符」语法写进 GITHUB_OUTPUT（直接 echo 只会保留首行）
          {
            echo 'body<<NEXTERM_RELEASE_BODY'
            cat "$body"
            echo 'NEXTERM_RELEASE_BODY'
          } >> "$GITHUB_OUTPUT"
          echo "Release 说明共 $(wc -c < "$body") 字节 / $(wc -l < "$body") 行"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NexTerm ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          # 先出草稿：产物齐了、检查过再点 Publish，避免半成品直接对用户可见。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
