name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.27.3
  GOFLAGS: -mod=readonly

jobs:
  version:
    name: Validate the release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      desktop-matrix: ${{ steps.desktop-matrix.outputs.value }}
      ort-version: ${{ steps.toolchain.outputs.ort_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the tagged commit to be on master
        run: |
          set -euo pipefail
          git fetch --no-tags origin master:refs/remotes/origin/master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::tag $GITHUB_REF_NAME is not on origin/master"
            exit 1
          fi
      - name: The tag drives the release version; version files stay 0.0.0 placeholders
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" != v* ]] || ! node scripts/check-semver.mjs "${tag#v}"; then
            echo "tag $tag is not a v<semver> release tag" >&2; exit 1;
          fi
          node scripts/check-placeholders.mjs
      - name: Require release signing configuration before any build
        env:
          NEXTERM_MINISIGN_PUBLIC_KEY: ${{ vars.NEXTERM_MINISIGN_PUBLIC_KEY }}
          NEXTERM_MINISIGN_PRIVATE_KEY: ${{ secrets.NEXTERM_MINISIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in NEXTERM_MINISIGN_PUBLIC_KEY NEXTERM_MINISIGN_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for a signed release"
              exit 1
            fi
          done
      - name: Normalize the updater public key without build secrets
        env:
          NEXTERM_MINISIGN_PUBLIC_KEY: ${{ vars.NEXTERM_MINISIGN_PUBLIC_KEY }}
        run: node scripts/build.mjs write-minisign-public-key --out="$RUNNER_TEMP/nexterm-minisign-preflight.pub"
      - name: Verify the updater key pair before any build
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.NEXTERM_MINISIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
          umask 077
          SECRET_KEY="$RUNNER_TEMP/nexterm-minisign-preflight.key"
          PUBLIC_KEY="$RUNNER_TEMP/nexterm-minisign-preflight.pub"
          MESSAGE="$RUNNER_TEMP/nexterm-minisign-preflight.txt"
          SIGNATURE="$MESSAGE.minisig"
          trap 'rm -f "$SECRET_KEY" "$MESSAGE" "$SIGNATURE"' EXIT
          printf '%s\n' "$MINISIGN_PRIVATE_KEY" > "$SECRET_KEY"
          test -s "$PUBLIC_KEY"
          printf 'NexTerm updater key preflight\n' > "$MESSAGE"
          minisign -S -W -s "$SECRET_KEY" -m "$MESSAGE" -x "$SIGNATURE"
          minisign -V -H -p "$PUBLIC_KEY" -m "$MESSAGE" -x "$SIGNATURE"
      - name: Validate the updater public key without build secrets
        env:
          NEXTERM_MINISIGN_PUBLIC_KEY: ${{ vars.NEXTERM_MINISIGN_PUBLIC_KEY }}
        run: node scripts/build.mjs desktop-ldflags --os=linux >/dev/null
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Resolve the latest ONNX Runtime once for the whole release
        id: toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXTERM_ORT_VERSION: ${{ vars.NEXTERM_ORT_VERSION }}
        run: node scripts/resolve-toolchain.mjs >> "$GITHUB_OUTPUT"
      - name: Generate the desktop release matrix from the native matrix
        id: desktop-matrix
        run: echo "value=$(node scripts/release-matrix.mjs)" >> "$GITHUB_OUTPUT"
  # Reusable workflow callers do not support timeout-minutes; ci.yml bounds every runner job.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    secrets:
      NEXTERM_ANDROID_KEYSTORE_BASE64: ${{ secrets.NEXTERM_ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      NEXTERM_IOS_P12_BASE64: ${{ secrets.NEXTERM_IOS_P12_BASE64 }}
      NEXTERM_IOS_P12_PASSWORD: ${{ secrets.NEXTERM_IOS_P12_PASSWORD }}
      NEXTERM_IOS_PROVISIONING_PROFILE: ${{ secrets.NEXTERM_IOS_PROVISIONING_PROFILE }}
    with:
      release_version: ${{ github.ref_name }}
      updater_public_key: ${{ vars.NEXTERM_MINISIGN_PUBLIC_KEY }}
      ort_version: ${{ needs.version.outputs.ort-version }}

  desktop:
    name: ${{ matrix.os }}/${{ matrix.arch }} native package
    needs: [ci, version]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.desktop-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      NEXTERM_RELEASE_REF: ${{ github.ref }}
      NEXTERM_MINISIGN_PUBLIC_KEY: ${{ vars.NEXTERM_MINISIGN_PUBLIC_KEY }}
      NEXTERM_MACOS_SIGNING: ${{ vars.NEXTERM_MACOS_SIGNING }}
      NEXTERM_MACOS_SIGN_IDENTITY: ${{ vars.NEXTERM_MACOS_SIGN_IDENTITY }}
      NEXTERM_MACOS_NOTARY_KEY_ID: ${{ vars.NEXTERM_MACOS_NOTARY_KEY_ID }}
      NEXTERM_MACOS_NOTARY_ISSUER: ${{ vars.NEXTERM_MACOS_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the release version from the tag
        shell: bash
        run: |
          echo "NEXTERM_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "NEXTERM_ORT_VERSION=${{ needs.version.outputs.ort-version }}" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Restore NSIS
        if: matrix.os == 'windows'
        id: nsis-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:/Program Files (x86)/NSIS
          key: nsis-3.12-${{ runner.os }}-${{ runner.arch }}
      - uses: ./.github/actions/go-toolchain
      - name: Install the pinned Wails CLI
        if: matrix.os == 'windows'
        uses: ./.github/actions/wails-cli
      - name: Install NSIS
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.nsis-cache.outputs.cache-hit }}" = "true" ]; then
            MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/NSIS/makensis.exe" /VERSION
            exit 0
          fi
          if command -v makensis >/dev/null 2>&1; then
            echo "using preinstalled $(command -v makensis)"
            MSYS_NO_PATHCONV=1 makensis /VERSION
            exit 0
          fi
          # Fail closed: only install when the tool is neither cached nor preinstalled,
          # and reject any package whose download cannot be checksum-verified.
          choco install nsis --version=3.12 --yes --no-progress --require-checksums
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/NSIS/makensis.exe" /VERSION
      - name: Ensure 7-Zip can inspect the finished installer
        if: matrix.os == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -x "/c/Program Files/7-Zip/7z.exe" ] && ! command -v 7z >/dev/null 2>&1; then
            choco install 7zip --version=25.01 --yes --no-progress --require-checksums
          fi
          if [ -x "/c/Program Files/7-Zip/7z.exe" ]; then
            "/c/Program Files/7-Zip/7z.exe" i >/dev/null
          else
            7z i >/dev/null
          fi
      - name: Download the verified frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: target/release-work/verified-dist
      - name: Download the verified CI desktop binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-desktop
          path: target/release-work/reused-native
      - name: Download nine helper binaries and metadata records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*-helper
          merge-multiple: true
          path: target/release-work/verified-helpers
      - name: Stage the verified desktop binary and nine SSH helpers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/go-build
          suffix=""
          if [ "${{ matrix.os }}" = "windows" ]; then suffix=".exe"; fi
          binary="nexterm-desktop-${{ matrix.os }}-${{ matrix.arch }}${suffix}"
          cp "target/release-work/reused-native/go-build/${binary}" "target/release-work/reused-native/go-build/${binary}.manifest.json" target/go-build/
          cp -R target/release-work/reused-native/go-build/ai-runtime-* target/go-build/
          if [ "${{ matrix.os }}" != "windows" ]; then chmod +x "target/go-build/${binary}"; fi
          while IFS='|' read -r helper_os helper_arch helper; do
            cp "target/release-work/verified-helpers/go-build/$helper" "target/release-work/verified-helpers/go-build/$helper.manifest.json" target/go-build/
            chmod +x "target/go-build/$helper"
          done < <(node .github/scripts/helper-matrix.mjs --shell)
      - name: Import the macOS signing identity (optional)
        if: matrix.os == 'darwin' && env.NEXTERM_MACOS_SIGNING == 'true'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.NEXTERM_MACOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.NEXTERM_MACOS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/nexterm-macos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          P12="$RUNNER_TEMP/nexterm-signing.p12"
          echo "$P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$P12"
          printf 'NEXTERM_MACOS_SIGN_IDENTITY=%s\n' "$NEXTERM_MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
      - name: Prepare macOS notarization credentials (optional)
        if: matrix.os == 'darwin' && env.NEXTERM_MACOS_SIGNING == 'true'
        shell: bash
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NEXTERM_MACOS_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$NOTARY_KEY_BASE64" ]; then
            (umask 077; echo "$NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/nexterm-notary.p8")
            printf 'NEXTERM_MACOS_NOTARY_KEY_PATH=%s\n' "$RUNNER_TEMP/nexterm-notary.p8" >> "$GITHUB_ENV"
            printf 'NEXTERM_MACOS_NOTARY_KEY_ID=%s\n' "$NEXTERM_MACOS_NOTARY_KEY_ID" >> "$GITHUB_ENV"
            printf 'NEXTERM_MACOS_NOTARY_ISSUER=%s\n' "$NEXTERM_MACOS_NOTARY_ISSUER" >> "$GITHUB_ENV"
          fi
      - name: Package the verified production desktop with updater evidence
        run: node scripts/build.mjs desktop --release --package --package-only --consume-dist=target/release-work/verified-dist/dist --dist-manifest=target/release-work/verified-dist/target/dist-manifest.json --os=${{ matrix.os }} --arch=${{ matrix.arch }} --require-evidence
      # Extracts the finished dmg/exe/deb and loads the bundled ONNX Runtime from it
      # (macOS also checks the hardened-runtime entitlement), so a package that
      # builds and hashes fine but cannot load its runtime fails before upload.
      - name: Smoke-test the packaged privacy runtime
        shell: bash
        run: |
          set -euo pipefail
          suffix=""; if [ "${{ matrix.os }}" = "windows" ]; then suffix=".exe"; fi
          CGO_ENABLED=0 go build -o "target/release-work/ort-load-check${suffix}" ./scripts/ort-load-check
          case "${{ matrix.os }}" in darwin) kind=macos; ext=dmg;; windows) kind=windows; ext=exe;; *) kind=linux; ext=deb;; esac
          shopt -s nullglob
          artifacts=(target/release-assets/nexterm-desktop_${kind}_${{ matrix.arch }}_*.${ext})
          test "${#artifacts[@]}" -eq 1 || { echo "::error::expected exactly one packaged ${ext}, found ${#artifacts[@]}"; exit 1; }
          node .github/scripts/verify-packaged-runtime.mjs "${artifacts[0]}" "${{ matrix.os }}" "${{ matrix.arch }}" "target/release-work/ort-load-check${suffix}"
      - name: Clean up macOS signing material (optional)
        if: always() && matrix.os == 'darwin' && env.NEXTERM_MACOS_SIGNING == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/nexterm-macos-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/nexterm-signing.p12" "$RUNNER_TEMP/nexterm-notary.p8"
      - name: Upload candidate and raw/final reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            target/release-assets/
            target/go-build/*.artifact.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  server:
    name: Linux ${{ matrix.arch }} full package with optional restricted runtime
    needs: [ci, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the release version from the tag
        shell: bash
        run: |
          echo "NEXTERM_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "NEXTERM_ORT_VERSION=${{ needs.version.outputs.ort-version }}" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - uses: ./.github/actions/go-toolchain
      - name: Download the verified frontend dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: target/release-work/verified-dist
      - name: Download the CI production server binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-linux-${{ matrix.arch }}-server
          path: target/release-work/reused-native
      - name: Download nine helper binaries and metadata records
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*-helper
          merge-multiple: true
          path: target/release-work/verified-helpers
      - name: Stage the reused production server binary and nine SSH helpers
        shell: bash
        run: |
          set -euo pipefail
          binary="nexterm-server-linux-${{ matrix.arch }}"
          mkdir -p target/go-build
          cp "target/release-work/reused-native/go-build/${binary}" "target/release-work/reused-native/go-build/${binary}.manifest.json" target/go-build/
          cp -R target/release-work/reused-native/go-build/ai-runtime-* target/go-build/
          chmod +x "target/go-build/${binary}"
          while IFS='|' read -r helper_os helper_arch helper; do
            cp "target/release-work/verified-helpers/go-build/$helper" "target/release-work/verified-helpers/go-build/$helper.manifest.json" target/go-build/
            chmod +x "target/go-build/$helper"
          done < <(node .github/scripts/helper-matrix.mjs --shell)
      - name: Verify the reused production server binary against its manifest
        run: node .github/scripts/verify-reused-binary.mjs "target/go-build/nexterm-server-linux-${{ matrix.arch }}" "server-linux-${{ matrix.arch }}" linux "${{ matrix.arch }}" 0
      - name: Restore the verified frontend for packaging
        run: node scripts/build.mjs frontend --consume-dist=target/release-work/verified-dist/dist --dist-manifest=target/release-work/verified-dist/target/dist-manifest.json
      - name: Re-assert the reused binary evidence
        run: node scripts/build.mjs report --kind=server --cgo=0 --os=linux --arch=${{ matrix.arch }} --file=target/go-build/nexterm-server-linux-${{ matrix.arch }}
      - name: Stage and verify the CI e2e report
        run: node .github/scripts/stage-server-evidence.mjs target/release-work/reused-native target/go-build/nexterm-server-linux-${{ matrix.arch }}
      - name: Produce and validate the full archive with final evidence gates
        run: bash scripts/pack-linux-server.sh --arch=${{ matrix.arch }} --require-evidence
      - name: Verify the archive carries the staged main binary bytes
        run: go run ./scripts/verify-server-archive "target/release-assets/nexterm-server_linux_${{ matrix.arch }}_${NEXTERM_RELEASE_VERSION}.tar.gz" "target/go-build/nexterm-server-linux-${{ matrix.arch }}"
      - name: Upload candidates and raw/final reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-server-linux-${{ matrix.arch }}
          path: |
            target/release-assets/
            target/go-build/*.artifact.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Upload runtime evidence outside the release candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-server-linux-${{ matrix.arch }}
          path: target/e2e-sync/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  agent:
    name: Device agent archives (linux/darwin tar.gz, windows zip)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the release version from the tag
        shell: bash
        run: echo "NEXTERM_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - uses: ./.github/actions/go-toolchain
      - name: Download the CI production agent binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*-agent
          path: target/release-work/agent-native
          merge-multiple: true
      - name: Stage and verify the reused production agent binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/go-build
          for spec in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 windows-amd64; do
            os="${spec%-*}"
            arch="${spec#*-}"
            suffix=""
            if [ "$os" = "windows" ]; then suffix=".exe"; fi
            binary="nexterm-agent-${os}-${arch}${suffix}"
            cp "target/release-work/agent-native/go-build/${binary}" "target/release-work/agent-native/go-build/${binary}.manifest.json" target/go-build/
            if [ "$os" != "windows" ]; then chmod +x "target/go-build/${binary}"; fi
            node .github/scripts/verify-reused-binary.mjs "target/go-build/${binary}" "agent-${os}-${arch}" "$os" "$arch" 0
          done
      - name: Produce and validate the agent archives with final evidence gates
        run: bash scripts/pack-agent.sh --require-evidence
      - name: Upload candidates and raw/final reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-agent
          path: target/release-assets/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  mobile:
    name: Android mobile package
    needs: [ci, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXTERM_ANDROID_CERT_SHA256: ${{ vars.NEXTERM_ANDROID_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the release version from the tag
        shell: bash
        run: |
          echo "NEXTERM_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "NEXTERM_ORT_VERSION=${{ needs.version.outputs.ort-version }}" >> "$GITHUB_ENV"
          echo "GITHUB_TOKEN=${{ github.token }}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - uses: ./.github/actions/go-toolchain
      - name: Download the verified Android package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-android
          path: target/release-work/mobile-input
      - name: Package and verify the Android artifact
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          package="nexterm-desktop_android_arm64_${NEXTERM_RELEASE_VERSION}.apk"
          mkdir -p target/release-assets
          cp "target/release-work/mobile-input/nexterm.apk" "target/release-assets/$package"
          go run ./scripts/mobile-evidence "target/release-assets/$package" mobile-android
      - name: Upload mobile candidates and raw/final reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mobile-android
          path: |
            target/release-assets/
            target/go-build/*.artifact.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  publish:
    name: Verify complete release evidence and upload a draft
    needs: [desktop, server, mobile, agent]
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: ${{ !failure() && !cancelled() && needs.desktop.result == 'success' && needs.server.result == 'success' && needs.mobile.result == 'success' && needs.agent.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXTERM_MINISIGN_PUBLIC_KEY: ${{ vars.NEXTERM_MINISIGN_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - name: Resolve the release version from the tag
        shell: bash
        run: echo "NEXTERM_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: target/release-work/candidate-input
      - name: Check every downloaded basename and hash before flattening
        run: node scripts/flatten-release-assets.mjs target/release-work/candidate-input --into target/release-work/candidate
      - name: Require every final artifact, hash and evidence report
        run: node .github/scripts/release-evidence.mjs target/release-work/candidate
      - name: Normalize the updater public key for signing and release
        run: node scripts/build.mjs write-minisign-public-key --out="$RUNNER_TEMP/nexterm-minisign.pub"
      - name: Sign and verify SHA256SUMS with the required minisign key pair
        shell: bash
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.NEXTERM_MINISIGN_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$MINISIGN_PRIVATE_KEY" || -z "$NEXTERM_MINISIGN_PUBLIC_KEY" ]]; then
            echo "::error::NEXTERM_MINISIGN_PRIVATE_KEY and NEXTERM_MINISIGN_PUBLIC_KEY are required for an updater-signed release"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends minisign
          umask 077
          SECRET_KEY="$RUNNER_TEMP/nexterm-minisign.key"
          PUBLIC_KEY="$RUNNER_TEMP/nexterm-minisign.pub"
          trap 'rm -f "$SECRET_KEY" "$PUBLIC_KEY"' EXIT
          printf '%s\n' "$MINISIGN_PRIVATE_KEY" > "$SECRET_KEY"
          test -s "$PUBLIC_KEY"
          minisign -S -W -s "$SECRET_KEY" -m target/release-work/candidate/SHA256SUMS -x target/release-work/candidate/SHA256SUMS.minisig -t "NexTerm ${NEXTERM_RELEASE_VERSION} SHA256SUMS"
          minisign -V -H -p "$PUBLIC_KEY" -m target/release-work/candidate/SHA256SUMS -x target/release-work/candidate/SHA256SUMS.minisig
          cp "$PUBLIC_KEY" target/release-work/candidate/SHA256SUMS.minisign.pub
          printf '`SHA256SUMS` 附带 `SHA256SUMS.minisig` 与 `SHA256SUMS.minisign.pub`；可运行 `minisign -V -H -p SHA256SUMS.minisign.pub -m SHA256SUMS` 验证。\n' > target/release-work/candidate/release-signing.md
      - name: Attest build provenance for the checksum manifest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: target/release-work/candidate/SHA256SUMS
      - name: Assemble release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            node .github/scripts/release-notes.mjs "$GITHUB_REF_NAME"
            cat .github/release-template.md
            printf '\n### 验证说明\n\n本 Release 附带 `SHA256SUMS`（文件校验和），其 GitHub build provenance 已生成。\n'
            cat target/release-work/candidate/release-signing.md
          } > target/release-work/candidate/release-body.md
          previous="$(node .github/scripts/release-notes.mjs --prev-tag "$GITHUB_REF_NAME")"
          if [ -n "$previous" ]; then
            printf '\n完整对比：[%s...%s](https://github.com/%s/compare/%s...%s)\n' "$previous" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" "$previous" "$GITHUB_REF_NAME" >> target/release-work/candidate/release-body.md
          fi
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/release-upload.mjs target/release-work/candidate --notes-file target/release-work/candidate/release-body.md

  testflight:
    name: Upload the signed iOS build to TestFlight
    needs: publish
    if: ${{ !failure() && !cancelled() && vars.NEXTERM_IOS_SIGNING == 'true' && vars.NEXTERM_IOS_TESTFLIGHT_UPLOAD == 'true' }}
    runs-on: macos-26
    timeout-minutes: 30
    env:
      NEXTERM_IOS_SIGNING: ${{ vars.NEXTERM_IOS_SIGNING }}
      NEXTERM_IOS_ASC_KEY_ID: ${{ vars.NEXTERM_IOS_ASC_KEY_ID }}
      NEXTERM_IOS_ASC_ISSUER: ${{ vars.NEXTERM_IOS_ASC_ISSUER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve the release version from the tag
        run: echo "NEXTERM_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - uses: ./.github/actions/go-toolchain
      - name: Download the signed iOS distribution IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-ios-dist
          path: target/release-work/testflight-input
      - name: Require device platform and valid iOS package evidence
        env:
          GITHUB_SHA: ${{ github.sha }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}
        run: go run ./scripts/mobile-evidence target/release-work/testflight-input/nexterm.ipa mobile-ios
      - name: Upload the signed IPA to TestFlight
        env:
          ASC_KEY_BASE64: ${{ secrets.NEXTERM_IOS_ASC_KEY_BASE64 }}
        run: |
          set -euo pipefail
          for name in ASC_KEY_BASE64 NEXTERM_IOS_ASC_KEY_ID NEXTERM_IOS_ASC_ISSUER; do
            if [[ -z "${!name}" ]]; then
              echo "::error::TestFlight upload is enabled but $name is missing; cannot upload to TestFlight"
              exit 1
            fi
          done
          umask 077
          mkdir -p private_keys
          echo "$ASC_KEY_BASE64" | base64 --decode > "private_keys/AuthKey_${NEXTERM_IOS_ASC_KEY_ID}.p8"
          xcrun altool --upload-app --type ios -f target/release-work/testflight-input/nexterm.ipa --apiKey "$NEXTERM_IOS_ASC_KEY_ID" --apiIssuer "$NEXTERM_IOS_ASC_ISSUER"
      - name: Remove the App Store Connect key
        if: always()
        run: rm -f private_keys/AuthKey_*.p8
