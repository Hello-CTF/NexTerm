name: Release

# 打 `v*` tag 即出安装包并挂到 Release。
#
# 为什么必须在 CI 里出包：**Tauri 不能跨平台打包** —— NSIS 只能在 Windows 出，
# .app/.dmg 只能在 macOS 出。一台机器出一个平台，用矩阵各出一份。
on:
  push:
    tags: ["v*"]
# 刻意不挂 workflow_dispatch：手动触发时 github.ref_name 是**分支名**而不是 tag，
# tauri-action 会照着分支名去建 Release。要试流水线就推一个预发布 tag（如 v0.1.2-rc1）。

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ matrix.os }} · 出包
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            # 平台覆盖文件 tauri.macos.conf.json 会自动合并（app + dmg + icon.icns）。
            args: "--bundles app,dmg"
          - os: windows-latest
            # tauri.conf.json 的基线 targets 就是 nsis + icon.ico。
            args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NexTerm ${{ github.ref_name }}"
          releaseBody: |
            | 平台 | 文件 |
            |---|---|
            | Windows 10/11 x64 | `*_x64-setup.exe`（NSIS 安装器） |
            | macOS（Apple Silicon） | `*_aarch64.dmg` |

            ### macOS 首次打开会被拦一次（预期行为，不是文件损坏）

            安装包是 **ad-hoc 签名、未公证**的（没有 Apple Developer 证书）：

            1. 双击应用，看到「无法验证开发者 / 无法检查是否包含恶意软件」→ 点**完成**
            2. **系统设置 → 隐私与安全性**，下拉到「安全性」，点 **「仍要打开」**
            3. 之后正常双击即可

            如果提示的是**「已损坏」**而不是「无法验证开发者」，那是早期版本的签名缺陷，
            请改用最新版本；或用命令行修掉：`xattr -dr com.apple.quarantine /Applications/NexTerm.app`
          # 先出草稿：产物齐了、检查过再点 Publish，避免半成品直接对用户可见。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
