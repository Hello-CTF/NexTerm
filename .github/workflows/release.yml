name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.26.8
  GOFLAGS: -mod=readonly

jobs:
  ci-source:
    name: Validate the tag and resolve a green same-SHA CI run
    runs-on: ubuntu-latest
    outputs:
      artifact-run-id: ${{ steps.resolve.outputs.artifact-run-id }}
      reused: ${{ steps.resolve.outputs.reused }}
    steps:
      - uses: actions/checkout@v7
      - name: The tag drives the release version; version files stay 0.0.0 placeholders
        run: |
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $tag is not a v<semver> release tag" >&2; exit 1;
          fi
          node -e '
            const fs = require("node:fs");
            const wails = require("./wails.json").info.version;
            const pkg = require("./package.json").version;
            const lazycat = fs.readFileSync("./lazycat/package.yml", "utf8").match(/^version:\s*(\S+)\s*$/m)?.[1];
            if (wails !== "0.0.0" || pkg !== "0.0.0" || lazycat !== "0.0.0") {
              throw new Error(`version files must stay 0.0.0 placeholders (wails.json=${wails}, package.json=${pkg}, lazycat/package.yml=${lazycat}); the release version comes from the tag`);
            }'
      - name: Find a completed green CI run with reusable artifacts
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_REUSE_EXPECTED_REF: ${{ github.ref_name }}
        run: bash .github/scripts/resolve-ci-reuse.sh >> "$GITHUB_OUTPUT"

  ci:
    needs: ci-source
    if: needs.ci-source.outputs.reused != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      release_version: ${{ github.ref_name }}

  desktop:
    name: ${{ matrix.os }}/${{ matrix.arch }} native package
    needs: [ci-source, ci]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the release version from the tag
        shell: bash
        run: echo "NEXTERM_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Restore the pinned Wails CLI
        if: matrix.os == 'windows'
        id: wails-cache
        uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: wails3-v3.0.0-beta.27-${{ runner.os }}-${{ runner.arch }}-go1.26.8
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Install the pinned Wails CLI
        if: matrix.os == 'windows'
        shell: bash
        run: |
          if [ "${{ steps.wails-cache.outputs.cache-hit }}" != "true" ]; then
            go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
          fi
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          wails3 version
      - name: Install NSIS
        if: matrix.os == 'windows'
        run: choco install nsis --version=3.12 --yes --no-progress
      - name: Download the verified frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: verified-dist
          run-id: ${{ needs.ci-source.outputs.artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the CI production desktop binary
        uses: actions/download-artifact@v8
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}-desktop
          path: reused-native
          run-id: ${{ needs.ci-source.outputs.artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage the reused production binary
        shell: bash
        run: |
          set -euo pipefail
          binary="nexterm-desktop-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }}"
          mkdir -p target/go-build
          cp "reused-native/go-build/${binary}" "reused-native/go-build/${binary}.manifest.json" target/go-build/
          if [ "${{ matrix.os }}" != "windows" ]; then
            chmod +x "target/go-build/${binary}"
          fi
      # 可选签名:在仓库 variables/secrets 配置后自动启用(自签固定身份或 Developer ID 均可);
      # 公证只有 Developer ID + App Store Connect API 密钥能过,未配置时保持 ad-hoc 分发。
      - name: Import the macOS signing identity (optional)
        if: matrix.os == 'darwin' && vars.NEXTERM_MACOS_SIGNING == 'true'
        shell: bash
        env:
          P12_BASE64: ${{ secrets.NEXTERM_MACOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.NEXTERM_MACOS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$HOME/Library/Keychains/nexterm-signing.keychain-db"
          echo "$P12_BASE64" | base64 --decode > /tmp/nexterm-signing.p12
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security import /tmp/nexterm-signing.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "" "$KEYCHAIN"
          shred -u /tmp/nexterm-signing.p12 2>/dev/null || rm -f /tmp/nexterm-signing.p12
          echo "NEXTERM_MACOS_SIGN_IDENTITY=${{ vars.NEXTERM_MACOS_SIGN_IDENTITY }}" >> "$GITHUB_ENV"
      - name: Prepare macOS notarization credentials (optional)
        if: matrix.os == 'darwin' && vars.NEXTERM_MACOS_SIGNING == 'true'
        shell: bash
        env:
          NOTARY_KEY_BASE64: ${{ secrets.NEXTERM_MACOS_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$NOTARY_KEY_BASE64" ]; then
            (umask 077; echo "$NOTARY_KEY_BASE64" | base64 --decode > /tmp/nexterm-notary.p8)
            echo "NEXTERM_MACOS_NOTARY_KEY_PATH=/tmp/nexterm-notary.p8" >> "$GITHUB_ENV"
            echo "NEXTERM_MACOS_NOTARY_KEY_ID=${{ vars.NEXTERM_MACOS_NOTARY_KEY_ID }}" >> "$GITHUB_ENV"
            echo "NEXTERM_MACOS_NOTARY_ISSUER=${{ vars.NEXTERM_MACOS_NOTARY_ISSUER }}" >> "$GITHUB_ENV"
          fi
      - name: Package the verified production binary and enforce final artifact evidence
        run: node scripts/build.mjs desktop --release --package --package-only --consume-dist=verified-dist/dist --dist-manifest=verified-dist/target/dist-manifest.json --os=${{ matrix.os }} --arch=${{ matrix.arch }} --require-evidence
      - name: Clean up notarization key (optional)
        if: matrix.os == 'darwin' && vars.NEXTERM_MACOS_SIGNING == 'true' && always()
        shell: bash
        run: shred -u /tmp/nexterm-notary.p8 2>/dev/null || rm -f /tmp/nexterm-notary.p8
      - name: Upload candidate and raw/final reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            target/release-assets/
            target/go-build/*.artifact.json
          if-no-files-found: error

  server:
    name: Linux ${{ matrix.arch }} full package with optional restricted runtime
    needs: [ci-source, ci]
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the release version from the tag
        shell: bash
        run: echo "NEXTERM_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.8
          cache: true
      - name: Download the verified frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: verified-dist
          run-id: ${{ needs.ci-source.outputs.artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the CI production server binary
        uses: actions/download-artifact@v8
        with:
          name: native-linux-${{ matrix.arch }}-server
          path: reused-native
          run-id: ${{ needs.ci-source.outputs.artifact-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage the reused production server binary
        shell: bash
        run: |
          set -euo pipefail
          binary="nexterm-server-linux-${{ matrix.arch }}"
          mkdir -p target/go-build
          cp "reused-native/go-build/${binary}" "reused-native/go-build/${binary}.manifest.json" target/go-build/
          chmod +x "target/go-build/${binary}"
      - name: Verify the reused production server binary against its manifest
        run: node .github/scripts/verify-reused-binary.mjs "target/go-build/nexterm-server-linux-${{ matrix.arch }}" "server-linux-${{ matrix.arch }}" linux "${{ matrix.arch }}" 0
      - name: Restore the verified frontend for packaging
        run: node scripts/build.mjs frontend --consume-dist=verified-dist/dist --dist-manifest=verified-dist/target/dist-manifest.json
      - name: Re-assert the reused binary evidence
        run: node scripts/build.mjs report --kind=server --os=linux --arch=${{ matrix.arch }} --file=target/go-build/nexterm-server-linux-${{ matrix.arch }}
      - name: Stage and verify the reused CI e2e report
        if: needs.ci-source.outputs.reused == 'true'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/go-build/nexterm-server-linux-${{ matrix.arch }}"
          report="reused-native/e2e-sync/report.json"
          [ -f "$report" ] || { echo "reused CI artifact has no e2e report: $report" >&2; exit 1; }
          jq -e '.status == "passed" and .failed == 0' "$report" >/dev/null || { echo "reused CI e2e report is not a clean pass: $report" >&2; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then actual="$(sha256sum "$binary" | cut -d' ' -f1)"; else actual="$(shasum -a 256 "$binary" | cut -d' ' -f1)"; fi
          expected="$(jq -r '.artifact.sha256' "${binary}.manifest.json")"
          [ "$actual" = "$expected" ] || { echo "staged server binary sha256 $actual does not match the CI manifest $expected that produced the e2e report" >&2; exit 1; }
          mkdir -p target/e2e-sync
          cp -R reused-native/e2e-sync/. target/e2e-sync/
      - name: Exercise the packaged server before archiving
        if: needs.ci-source.outputs.reused != 'true'
        run: python3 scripts/e2e-sync-local.py --bin target/go-build/nexterm-server-linux-${{ matrix.arch }} --no-build
      - name: Produce and validate the full archive with final evidence gates
        run: bash scripts/pack-linux-server.sh --arch=${{ matrix.arch }} --require-evidence
      - name: Upload candidates and raw/final reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-server-linux-${{ matrix.arch }}
          path: |
            target/release-assets/
            target/go-build/*.artifact.json
          if-no-files-found: error
      - name: Upload runtime evidence outside the release candidate
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-server-linux-${{ matrix.arch }}
          path: target/e2e-sync/
          if-no-files-found: error

  publish:
    name: Verify complete release evidence and upload a draft
    needs: [desktop, server]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the release version from the tag
        shell: bash
        run: echo "NEXTERM_RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: candidate
          merge-multiple: true
      - name: Flatten directories preserved by multi-path artifact uploads
        shell: bash
        run: |
          set -euo pipefail
          for directory in release-assets go-build; do
            if [[ -d "candidate/$directory" ]]; then
              find "candidate/$directory" -type f -exec mv -f {} candidate/ \;
              find "candidate/$directory" -depth -type d -empty -delete
            fi
          done
      - name: Require every final artifact, hash and evidence report
        run: node .github/scripts/release-evidence.mjs candidate
      - name: Assemble release notes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/release-template.md > candidate/release-body.md
          printf '\n### 验证说明\n\n本 Release 附带 `SHA256SUMS`（文件校验和）。\n真实环境验证缺口（真实浏览器、真机安装与部署等）见仓库文档。\n' >> candidate/release-body.md
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/release-upload.mjs candidate --notes-file candidate/release-body.md
