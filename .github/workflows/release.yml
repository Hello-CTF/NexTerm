name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: go1.26.8
  GOFLAGS: -mod=readonly

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  precondition:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag and wails.json are the same version source
        run: node -e 'const v=require("./wails.json").info.version; if (process.env.GITHUB_REF_NAME !== `v${v}`) throw new Error(`${process.env.GITHUB_REF_NAME} != v${v}`)'

  desktop:
    name: ${{ matrix.os }}/${{ matrix.arch }} native package
    needs: precondition
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: amd64
          - runner: windows-11-arm
            os: windows
            arch: arm64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
          - runner: ubuntu-latest
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: true
      - name: Install the pinned Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.98
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install NSIS
        if: matrix.os == 'windows'
        run: choco install nsis --version=3.11 --yes --no-progress
      - name: Install Linux WebView packaging dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify bindings
        run: node scripts/build.mjs bindings
      - name: Build, package and enforce final artifact size evidence
        run: node scripts/build.mjs desktop --release --repro-check --os=${{ matrix.os }} --arch=${{ matrix.arch }} --package --require-size
      - name: Upload candidate and raw/final reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            target/release-assets/
            target/go-build/*.artifact.json
          if-no-files-found: error

  server:
    name: Linux ${{ matrix.arch }} full package with optional restricted runtime
    needs: precondition
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.8
          cache: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static Go server and reproducible frontend
        run: |
          node scripts/build.mjs server --release --repro-check --os=linux --arch=${{ matrix.arch }}
          node scripts/build.mjs frontend --repro-check
      - name: Exercise the packaged server before archiving
        run: python3 scripts/e2e-sync-local.py --bin target/go-build/nexterm-server-linux-${{ matrix.arch }} --no-build
      - name: Produce and validate the full archive with final size gates
        run: bash scripts/pack-linux-server.sh --arch=${{ matrix.arch }} --require-size
      - name: Upload candidates and raw/final reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-server-linux-${{ matrix.arch }}
          path: |
            target/release-assets/
            target/go-build/*.artifact.json
          if-no-files-found: error
      - name: Upload runtime evidence outside the release candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-server-linux-${{ matrix.arch }}
          path: target/e2e-sync/
          if-no-files-found: error

  publish:
    name: Verify complete release evidence and upload a draft
    needs: [desktop, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: candidate
          merge-multiple: true
      - name: Flatten directories preserved by multi-path artifact uploads
        shell: bash
        run: |
          set -euo pipefail
          for directory in release-assets go-build; do
            if [[ -d "candidate/$directory" ]]; then
              find "candidate/$directory" -type f -exec mv -f {} candidate/ \;
              find "candidate/$directory" -depth -type d -empty -delete
            fi
          done
      - name: Require every final artifact, hash and size report
        run: node .github/scripts/release-evidence.mjs candidate
      - name: Assemble release notes
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes" ]]; then cat "$notes" > candidate/release-body.md; printf '\n---\n\n' >> candidate/release-body.md; else : > candidate/release-body.md; fi
          cat .github/release-template.md >> candidate/release-body.md
          printf '\n### Verification evidence\n\nSee `release-evidence.json`, `SHA256SUMS` and `real-target-gaps.json`. Evidence gaps are not passed acceptance. LazyCat and deployed Pages packaging/real-target acceptance are delivered by M47.\n' >> candidate/release-body.md
      - name: Create or update the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(candidate/*.exe candidate/*.dmg candidate/*.tar.gz candidate/SHA256SUMS candidate/release-evidence.json candidate/real-target-gaps.json)
          [ ${#files[@]} -eq 11 ] || { echo "expected 8 packages plus 3 evidence files, got ${#files[@]}"; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "NexTerm $GITHUB_REF_NAME" --notes-file candidate/release-body.md "${files[@]}"
          fi
          gh release view "$GITHUB_REF_NAME" --json assets,isDraft -q '{draft:.isDraft,assets:[.assets[].name]}'
