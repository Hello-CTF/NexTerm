[workspace]
# `nexterm-ipc-macros` 是 IPC 门面宏（桌面 / 服务端双态，见 src-tauri/src/ipc_shim.rs）。
# 放进 members 而不是只写 path 依赖：否则它在 workspace 外自成一个包，
# 会拿到自己的 target/ 与 Cargo.lock，`cargo fmt --all` / clippy 也扫不到它。
members = ["src-tauri", "src-tauri/nexterm-ipc-macros"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 16

# panic 策略刻意保持 unwind（默认值），**不要改回 abort**。
#
# abort 能省一点体积，代价却是：AI 任务跑在 tokio worker 线程上，那里任何一次
# panic 都会当场终止整个进程 —— 没有日志、没有错误提示，用户只看到「用到一半退出了」。
# 2026-09-28 就是这么丢掉一次真实会话的（agent.rs 一处阻塞读误用）。
# 改成 unwind 后，tokio 会把任务里的 panic 收进 JoinError，我们就能把「出错了」
# 推给界面、让进程活着（见 commands/ai.rs 的 spawn 包装）。
panic = "unwind"

# ── dev（开发版）体积 / 链接时间收敛 ──────────────────────────────────
#
# 默认 `debug = 2` 会写入完整调试信息，实测后果：
#   target/debug 16.4 GB，其中 .pdb 2.4 GB（nexterm.pdb 单文件 322 MB，
#   两个集成测试的 PDB 再加 460 MB），链接也慢。
# `line-tables-only` 保留"崩在哪一行"需要的行号信息，丢掉变量/类型信息 ——
# 日常排错够用，体积掉一个数量级。
[profile.dev]
debug = "line-tables-only"

# 依赖包一律不出调试信息：几乎不会去 step into 别人的 crate，
# 但它们贡献了 debug target 里的绝大部分体积。
# 注意：这一条会让**所有依赖重编一次**（fingerprint 变了），是一次性成本。
# 具体包的规则（下面 vt100 / russh）优先级更高，不受影响。
[profile.dev.package."*"]
debug = false

[profile.bench]
opt-level = 3
strip = false

[profile.dev.package.vt100]
opt-level = 2

[profile.dev.package.russh]
opt-level = 1
