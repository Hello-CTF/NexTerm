version: '3'

vars:
  GOFLAGS: '-mod=readonly'

tasks:
  fmt:
    summary: Format all Go sources
    cmds:
      - gofmt -w ./cmd ./internal ./migrations

  fmt:check:
    summary: Check Go formatting
    cmds:
      - |
        files="$(gofmt -l ./cmd ./internal ./migrations)"
        if [ -n "$files" ]; then
          printf 'gofmt required:\n%s\n' "$files" >&2
          exit 1
        fi

  vet:
    summary: Run go vet without updating dependency pins
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - go vet ./...

  test:
    summary: Run all Go tests without updating dependency pins
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - go test ./...

  check:
    summary: Run Go, frontend, generated-bindings and reproducibility quality gates
    deps: [fmt:check, vet, test]
    cmds:
      - go mod verify
      - pnpm typecheck
      - pnpm lint
      - pnpm test
      - node scripts/build.mjs bindings
      - node scripts/build.mjs frontend --repro-check
      - python3 scripts/verify-ci-prerequisites.py
      - python3 scripts/verify-ci-prerequisites.py --self-test

  bindings:
    summary: Regenerate Wails TypeScript bindings intentionally
    cmds:
      - wails3 generate bindings -ts -i -d src/ipc/bindings ./cmd/nexterm-desktop

  bindings:check:
    summary: Generate into a temporary directory and reject bindings drift
    cmds:
      - node scripts/build.mjs bindings

  frontend:
    summary: Build the real Vite assets twice and compare their tree hash
    cmds:
      - node scripts/build.mjs frontend --repro-check

  ci:prerequisites:
    summary: Verify CI/release workflow Linux cgo prerequisite ordering and release contract invariants
    cmds:
      - python3 scripts/verify-ci-prerequisites.py
      - python3 scripts/verify-ci-prerequisites.py --self-test

  server:build:
    summary: Build a stripped, static, zero-cgo Linux server
    cmds:
      - node scripts/build.mjs server --release --repro-check --os={{.GOOS | default "linux"}} --arch={{.GOARCH | default "amd64"}}

  desktop:build:
    summary: Build the Wails desktop with real frontend assets for the host
    cmds:
      - node scripts/build.mjs desktop --release --repro-check

  desktop:smoke:
    summary: Run the native WebView smoke with early/replay/binary/JSON assertions
    cmds:
      - node scripts/build.mjs desktop --release --repro-check --smoke

  windows:desktop:
    summary: Build the zero-cgo Windows amd64/arm64 Wails desktop
    cmds:
      - node scripts/build.mjs desktop --release --repro-check --os=windows --arch={{.GOARCH | default "amd64"}}

  darwin:desktop:
    summary: Build the native cgo-enabled macOS Wails desktop
    cmds:
      - node scripts/build.mjs desktop --release --repro-check --os=darwin --arch={{.GOARCH | default "arm64"}}

  linux:desktop:
    summary: Build the native cgo-enabled Linux amd64/arm64 Wails desktop
    cmds:
      - node scripts/build.mjs desktop --release --repro-check --os=linux --arch={{.GOARCH | default "amd64"}}

  package:
    summary: Package the host desktop and enforce all artifact size evidence
    cmds:
      - node scripts/build.mjs release

  linux:package:
    summary: Produce one full Linux server archive with both runtime units
    cmds:
      - bash scripts/pack-linux-server.sh --arch={{.GOARCH | default "amd64"}}

  sync:e2e:
    summary: Exercise Go-only two-instance sync and sync-only HTTP boundaries
    cmds:
      - python3 scripts/e2e-sync-local.py

  acceptance:browser:
    summary: Run real-Chromium responsive and WebSocket acceptance with explicit gaps
    cmds:
      - node .github/scripts/browser-acceptance.mjs

  verify:
    summary: Run quality gates and native host build/smoke checks
    deps: [check]
    cmds:
      - node scripts/build.mjs desktop --release --repro-check --smoke
