version: '3'

env:
  GOTOOLCHAIN: go1.26.8

vars:
  GOFLAGS: '-mod=readonly'
  APP_NAME: 'nexterm'
  BIN_DIR: 'bin'
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

includes:
  android: ./build/android/Taskfile.yml
  ios: ./build/ios/Taskfile.yml

tasks:
  fmt:
    summary: Format all Go sources
    cmds:
      - |
        "$(go env GOROOT)/bin/gofmt" -w ./cmd ./internal ./scripts ./build

  fmt:check:
    summary: Check Go formatting
    cmds:
      - |
        files="$("$(go env GOROOT)/bin/gofmt" -l ./cmd ./internal ./scripts ./build)"
        if [ -n "$files" ]; then
          printf 'gofmt required:\n%s\n' "$files" >&2
          exit 1
        fi

  vet:
    summary: Run go vet without updating dependency pins
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - go vet ./...

  test:
    summary: Run all Go tests without updating dependency pins
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - go test ./...

  test:database:
    summary: Discover and run every dbtest fixture contract against SQLite or the selected real database
    silent: true
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - |
        {{if .DBTEST_WRAPPER}}
        export NEXTERM_TEST_DB_BACKEND='{{.DBTEST_BACKEND}}'
        export NEXTERM_TEST_DB_DSN='{{.DBTEST_DSN}}'
        {{end}}
        go run ./scripts/test-database

  test:database:sqlite:
    summary: Run database fixture contracts explicitly against SQLite
    cmds:
      - task: test:database
        vars:
          DBTEST_WRAPPER: true
          DBTEST_BACKEND: sqlite
          DBTEST_DSN: ''

  test:database:postgres:
    summary: Start the development PostgreSQL 16 service and run database fixture contracts
    cmds:
      - docker compose -f deploy/dev/compose.yml up -d --wait postgres
      - task: test:database
        vars:
          DBTEST_WRAPPER: true
          DBTEST_BACKEND: postgres
          DBTEST_DSN: 'postgres://nexterm:nexterm@127.0.0.1:55433/nexterm_test?sslmode=disable'

  test:database:mysql:
    summary: Start the development MySQL 8.4 service and run database fixture contracts
    cmds:
      - docker compose -f deploy/dev/compose.yml up -d --wait mysql
      - task: test:database
        vars:
          DBTEST_WRAPPER: true
          DBTEST_BACKEND: mysql
          DBTEST_DSN: 'root:nexterm_root@tcp(127.0.0.1:33308)/nexterm_test?parseTime=true'

  test:database:mariadb:
    summary: Start the development MariaDB 11.4 service and run database fixture contracts
    cmds:
      - docker compose -f deploy/dev/compose.yml up -d --wait mariadb
      - task: test:database
        vars:
          DBTEST_WRAPPER: true
          DBTEST_BACKEND: mariadb
          DBTEST_DSN: 'root:nexterm_root@tcp(127.0.0.1:33309)/nexterm_test?parseTime=true'

  test:race:
    summary: Run Go tests with the race detector
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - go test -race ./...

  test:production:
    summary: Rebuild fresh frontend assets, test production embedding and clean staged assets
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - node scripts/test-production.mjs

  check:lockfile:
    summary: Verify pnpm can resolve the frozen lockfile without changing it
    cmds:
      - pnpm install --frozen-lockfile --lockfile-only --ignore-scripts

  check:go:
    summary: Run Go formatting, module, static, vet and test checks from fastest to slowest
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - task: fmt:check
      - go mod verify
      - go run ./scripts/verify-manifest-injects
      - task: vet
      - task: test

  check:frontend:
    summary: Lint, test, gate coverage, typecheck and reproducibly build the frontend
    cmds:
      - pnpm lint
      - pnpm test
      - pnpm test:coverage
      - task: frontend

  check:scripts:
    summary: Test tooling, release scripts, artifact evidence and fixture discovery
    env:
      GOFLAGS: '{{.GOFLAGS}}'
      SOURCE_DATE_EPOCH: '1'
    cmds:
      - go run ./scripts/test-database --check
      - go test -count=1 ./scripts/test-database
      - node scripts/check-placeholders.mjs
      - node --test scripts/*.test.mjs
      - node --test .github/scripts/*.test.mjs
      - python3 scripts/test-install-device.py
      - python3 scripts/test-systemd-install.py
      - go run ./scripts/check-release-evidence

  check:ci-quality:
    summary: Run shared static Go, generated artifact, bindings and script quality gates
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - task: fmt:check
      - go mod verify
      - go run ./scripts/verify-manifest-injects
      - task: ipc:contract:check
      - task: gorm:check
      - task: check:scripts
      - go test -count=1 ./scripts/compile-only
      - task: vet
      - task: bindings:check
      - GOOS=$(go env GOOS) GOARCH=$(go env GOARCH) go run -mod=readonly ./scripts/compile-only ./...

  check:
    summary: Run fast integrity checks before Go, bindings and frontend quality gates
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - task: check:lockfile
      - task: check:ci-quality
      - task: test
      - task: check:frontend
      - task: website:check

  website:check:
    summary: Typecheck and build the GitHub Pages website with the Pages commands
    cmds:
      - pnpm exec tsc -p website/tsconfig.json --noEmit
      - pnpm exec vite build --config website/vite.config.mjs

  gorm:gen:
    summary: Regenerate GORM queries and remove stale generated outputs
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - node scripts/gorm.mjs

  gorm:check:
    summary: Regenerate GORM queries temporarily and reject drift or orphan outputs
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - node scripts/gorm.mjs --check

  doctor:
    summary: Check development host and tool versions
    cmds:
      - node scripts/doctor.mjs

  ipc:contract:
    summary: Generate the incremental IPC manifest and opt-in TypeScript mappings
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - go run ./scripts/gen-ipc-contract

  ipc:contract:check:
    summary: Reject incremental IPC manifest and TypeScript mapping drift
    env:
      GOFLAGS: '{{.GOFLAGS}}'
    cmds:
      - go run ./scripts/gen-ipc-contract --check

  bindings:
    summary: Regenerate Wails TypeScript bindings intentionally with the pinned CLI
    cmds:
      - node scripts/build.mjs bindings --write

  bindings:check:
    summary: Generate into a temporary directory with the pinned CLI and reject bindings drift
    cmds:
      - node scripts/build.mjs bindings

  frontend:
    summary: Build the real Vite assets twice and compare their tree hash
    cmds:
      - node scripts/build.mjs frontend --repro-check

  server:build:
    summary: Build a stripped, static, zero-cgo Linux server
    cmds:
      - node scripts/build.mjs server --release --repro-check --os={{.GOOS | default "linux"}} --arch={{.GOARCH | default "amd64"}}

  desktop:build:
    summary: Build the Wails desktop with real frontend assets for the host
    cmds:
      - node scripts/build.mjs desktop --release --repro-check

  windows:desktop:
    summary: Build the zero-cgo Windows amd64/arm64 Wails desktop
    cmds:
      - node scripts/build.mjs desktop --release --repro-check --os=windows --arch={{.GOARCH | default "amd64"}}

  darwin:desktop:
    summary: Build the native cgo-enabled macOS Wails desktop
    cmds:
      - node scripts/build.mjs desktop --release --repro-check --os=darwin --arch={{.GOARCH | default "arm64"}}

  linux:desktop:
    summary: Build the native cgo-enabled Linux amd64/arm64 Wails desktop
    cmds:
      - node scripts/build.mjs desktop --release --repro-check --os=linux --arch={{.GOARCH | default "amd64"}}

  package:
    summary: Package the host desktop and enforce artifact assertion evidence
    cmds:
      - node scripts/build.mjs release

  linux:package:
    summary: Produce one full Linux server archive with both runtime units
    cmds:
      - bash scripts/pack-linux-server.sh --arch={{.GOARCH | default "amd64"}}

  device:e2e:
    summary: Exercise device enrollment, bridge transport and remote file operations
    cmds:
      - go run ./scripts/e2e-harness device

  sharing:e2e:
    summary: Exercise host sharing and public preview HTTP boundaries
    cmds:
      - go run ./scripts/e2e-harness sharing

  sync:e2e:
    summary: Exercise Go-only two-instance sync and sync-only HTTP boundaries
    cmds:
      - go run ./scripts/e2e-harness sync

  verify:
    summary: Run all checks, race and production tests, then reproducibly build the host desktop
    cmds:
      - task: check
      - task: test:race
      - task: test:production
      - node scripts/build.mjs desktop --release --repro-check --consume-dist=dist --dist-manifest=target/dist-manifest.json
