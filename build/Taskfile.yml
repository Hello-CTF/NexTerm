version: '3'

tasks:
  go:mod:tidy:
    summary: Checks that go.mod and go.sum are tidy
    internal: true
    run: once
    cmds:
      - go mod tidy -diff

  stamp:mobile:config:
    summary: Refresh the ignored generated mobile stamp config from NEXTERM_RELEASE_VERSION
    # Always runs (no sources/generates): go-task executes deps before the
    # dependent task's up-to-date check, so a version change or removal
    # reaches build/config.stamp.yml in time to invalidate cached generation.
    cmds:
      - node scripts/mobile-source.mjs stamp

  build:frontend:
    summary: Build or consume the manifest-verified frontend project
    run: once
    dir: .
    vars:
      DIST_SOURCE: '{{.DIST_SOURCE}}'
      DIST_MANIFEST: '{{.DIST_MANIFEST}}'
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.DIST_SOURCE}}" ]; then
          manifest="{{.DIST_MANIFEST}}"
          if [ -z "$manifest" ]; then
            manifest="$(dirname "{{.DIST_SOURCE}}")/target/dist-manifest.json"
          fi
          node scripts/build.mjs frontend --consume-dist="{{.DIST_SOURCE}}" --dist-manifest="$manifest"
        else
          node scripts/build.mjs frontend --repro-check
        fi
        rm -rf cmd/nexterm-desktop/dist
        cp -R dist cmd/nexterm-desktop/dist
