version: '3'

tasks:
  go:mod:tidy:
    summary: Checks that go.mod and go.sum are tidy
    internal: true
    run: once
    cmds:
      - go mod tidy -diff

  build:frontend:
    summary: Build or consume the manifest-verified frontend project
    run: once
    dir: .
    vars:
      DIST_SOURCE: '{{.DIST_SOURCE}}'
      DIST_MANIFEST: '{{.DIST_MANIFEST}}'
    cmds:
      - |
        set -euo pipefail
        if [ -n "{{.DIST_SOURCE}}" ]; then
          manifest="{{.DIST_MANIFEST}}"
          if [ -z "$manifest" ]; then
            manifest="$(dirname "{{.DIST_SOURCE}}")/target/dist-manifest.json"
          fi
          node scripts/build.mjs frontend --consume-dist="{{.DIST_SOURCE}}" --dist-manifest="$manifest"
        else
          node scripts/build.mjs frontend --repro-check
        fi
        rm -rf cmd/nexterm-desktop/dist
        cp -R dist cmd/nexterm-desktop/dist
