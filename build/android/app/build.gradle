plugins {
    id 'com.android.application'
}

def releaseVersion = System.getenv("NEXTERM_RELEASE_VERSION")
def hasReleaseVersion = releaseVersion != null && !releaseVersion.isEmpty()
def androidVersionName = "0.0.0"
def androidVersionCode = 1L
if (hasReleaseVersion) {
    def semverScript = new File(rootProject.projectDir, "../../scripts/check-semver.mjs").canonicalFile
    def versionProcess = ["node", semverScript.absolutePath, "--android-json", releaseVersion].execute()
    def versionOutput = new StringBuffer()
    def versionError = new StringBuffer()
    versionProcess.waitForProcessOutput(versionOutput, versionError)
    if (versionProcess.exitValue() != 0) {
        throw new GradleException("Cannot resolve Android release version: ${versionError.toString().trim()}")
    }
    def androidVersion = new groovy.json.JsonSlurper().parseText(versionOutput.toString())
    androidVersionName = androidVersion.versionName
    androidVersionCode = androidVersion.versionCode as long
}

def hasEnvironmentValue = { name ->
    def value = System.getenv(name)
    return value != null && !value.trim().isEmpty()
}
def keystoreFile = System.getenv("ANDROID_KEYSTORE_FILE")
def releaseSigningVariables = [
    "ANDROID_KEYSTORE_FILE",
    "ANDROID_KEYSTORE_PASSWORD",
    "ANDROID_KEY_ALIAS",
    "ANDROID_KEY_PASSWORD",
]
def signingRequired = hasReleaseVersion || System.getenv("NEXTERM_ANDROID_SIGNING_REQUIRED") == "true" || releaseSigningVariables.any { hasEnvironmentValue(it) }

gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { task -> task.name in ["assembleRelease", "bundleRelease", "packageRelease"] }) {
        if (!signingRequired) {
            logger.warn("Android Release is using the local debug signing configuration; set NEXTERM_RELEASE_VERSION or provide ANDROID_KEYSTORE_* for a signed release")
            return
        }
        def missing = releaseSigningVariables.findAll { name -> !hasEnvironmentValue(name) }
        if (!missing.isEmpty()) {
            throw new GradleException("Android release signing requires environment variables: ${missing.join(', ')}")
        }
        if (!project.file(keystoreFile).isFile() || !project.file(keystoreFile).canRead()) {
            throw new GradleException("ANDROID_KEYSTORE_FILE does not point to a readable keystore: ${keystoreFile}")
        }
    }
}

android {
    namespace 'com.wails.app'
    compileSdk 35

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "work.nexterm.app"
        minSdk 21
        targetSdk 35
        versionCode androidVersionCode.intValue()
        versionName androidVersionName

        // Configure supported ABIs
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (hasEnvironmentValue("ANDROID_KEYSTORE_FILE")) {
                storeFile file(keystoreFile)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingRequired ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Source sets configuration
    sourceSets {
        main {
            // JNI libraries are in jniLibs folder
            jniLibs.srcDirs = ['src/main/jniLibs']
            // Assets for the WebView
            assets.srcDirs = ['src/main/assets', '../gen/privacy-assets']
        }
    }

    // Packaging options
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        // Don't strip Go symbols in debug builds
        doNotStrip '*/arm64-v8a/libwails.so'
        doNotStrip '*/x86_64/libwails.so'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
