<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon.png" />
    <title>NexTerm</title>
    <script>
      (function () {
        var mode = "system";
        try {
          var saved = localStorage.getItem("nexterm.theme.v1");
          if (saved === "light" || saved === "dark" || saved === "system") mode = saved;
        } catch (e) {}
        var resolved = mode;
        if (mode === "system") {
          try {
            resolved = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          } catch (e) {
            resolved = "dark";
          }
        }
        var root = document.documentElement;
        root.dataset.nxTheme = resolved;

        var preset = 13;
        var scale = 1;
        var termTheme = "dark";
        try {
          var raw = localStorage.getItem("nexterm.appearance.v1");
          if (raw) {
            var o = JSON.parse(raw);
            if (o && typeof o === "object") {
              if (o.uiFontPreset === 12 || o.uiFontPreset === 13 || o.uiFontPreset === 14.5) {
                preset = o.uiFontPreset;
              }
              if (typeof o.uiFontScale === "number" && isFinite(o.uiFontScale)) {
                var clamped = Math.min(2, Math.max(1, o.uiFontScale));
                var steps = [1, 1.25, 1.5, 1.75, 2];
                var best = steps[0];
                for (var i = 1; i < steps.length; i++) {
                  if (Math.abs(steps[i] - clamped) < Math.abs(best - clamped)) best = steps[i];
                }
                scale = best;
              }
              if (o.terminalTheme === "dark" || o.terminalTheme === "light" || o.terminalTheme === "interface") {
                termTheme = o.terminalTheme;
              }
            }
          }
        } catch (e) {}
        root.style.setProperty("--nx-ui-font-size", preset + "px");
        root.style.setProperty("--nx-ui-scale", String(scale));
        root.style.setProperty("--nx-ui-text-factor", String((scale * preset) / 13));
        root.dataset.nxTermTheme = termTheme === "interface" ? resolved : termTheme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
