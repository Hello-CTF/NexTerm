[package]
name = "nexterm-privacy-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
name = "nexterm_privacy"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
regex = "=1.13.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokenizers = { version = "=0.23.1", default-features = false, features = ["onig"] }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["load-dynamic", "std"] }
libc = "=0.2.189"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_System_Threading"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
