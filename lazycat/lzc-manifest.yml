usage: |
  首次进入请到「凭据」面板确认凭据库状态。

  终端进程、会话与工作区布局都跑在这台微服上，浏览器只是接上去看：
  关掉网页不会结束会话，换一台设备打开即可接管原来那条终端，接着看原来的输出。

  浏览器版由微服注入凭据库的根密钥（同一台微服、同一个应用内稳定），
  因此进程内存里会持有解密后的密钥。这台微服是您自己的硬件，这是为了让
  「打开浏览器就能连服务器」成立。如果需要更强的隔离，请不要在这台微服上
  保存生产环境的 SSH 口令，改用密钥认证。

  磁盘挂载（sshfs）依赖「挂载 FUSE 文件系统」权限；未授权时该入口会置灰并给出原因。

  端口转发在此平台上不可用：平台的端口暴露是裸 TCP 且不带鉴权，应用侧补不上这个洞。
  需要把远端端口开放给外部时，请改用微服平台自带的转发功能。

application:
  #@build if profile=dev
  subdomain: nexterm-dev
  #@build else
  subdomain: nexterm
  #@build end

  routes:
    - /=http://nexterm-server:8080/

  public_path:
    # Device agent contract (/device/enroll, /agent/sync, /agent/current-url,
    # /ws/device) relies on public_path to bypass the platform session; device
    # identity is gated by device credentials, not platform gateway auth.
    # /share/public/{token} is the data plane of public share links (the token
    # is the credential, no platform session needed). All other routes
    # (including share management /share/links, /share/host-shares and
    # /sync/v2/* which needs an account session) stay behind platform auth.
    - /device/enroll
    - /agent/sync
    - /agent/current-url
    - /ws/device
    - /share/public

  injects:
    - id: gateway-auth
      on: request
      when:
        - /*
      do:
        - src: |
            ctx.headers.set("X-NexTerm-Gateway-Auth", ctx.params.key);
          params:
            key: '{{ stable_secret "gateway_auth" }}'
    - id: lazycat-file-bridge
      on: request
      when:
        - /__lazycat_file_bridge/*
      do:
        - src: |
            const bridgePrefix = "/__lazycat_file_bridge";
            const requestHost = String(ctx.request.host || "")
              .split(":")[0]
              .toLowerCase();
            const firstDot = requestHost.indexOf(".");
            const method = String(ctx.request.method || "").toUpperCase();

            if (
              firstDot <= 0 ||
              !requestHost.endsWith(".heiyu.space") ||
              !["GET", "HEAD", "PUT"].includes(method)
            ) {
              ctx.response.send(
                ["GET", "HEAD", "PUT"].includes(method) ? 400 : 405,
                "Invalid LazyCat file bridge request",
              );
              return;
            }

            const boxDomain = requestHost.slice(firstDot + 1);
            const fileOrigin = "https://file." + boxDomain;
            const targetPath =
              "/files/home" + ctx.request.path.slice(bridgePrefix.length);

            // 带上 Cookie 才能以**当前用户**身份访问网盘；Origin/Referer 留着会被
            // 目标端拒绝（跨域来源），所以显式删掉。
            ctx.headers.del("Origin");
            ctx.headers.del("Referer");
            ctx.proxy.to(fileOrigin, {
              path: targetPath,
              query: ctx.request.raw_query,
              use_target_host: true,
              timeout_ms: 120000,
              on_fail: "error",
            });
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
          params:
            diskRoot: /_lzc/files/home
            fileBridgeRoot: /__lazycat_file_bridge
            fallbackMime: application/octet-stream

services:
  nexterm-server:
    image: embed:nexterm-server
    environment:
      - NEXTERM_LAZYCAT_VAULT_MASTER_KEY={{ stable_secret "vault_master" }}
      - NEXTERM_GATEWAY_AUTH={{ stable_secret "gateway_auth" }}
      - NEXTERM_DATA_DIR=/lzcapp/var/nexterm
      - NEXTERM_WEB_ROOT=/lzcapp/pkg/content/web
      - NEXTERM_LISTEN=0.0.0.0:8080
      - NEXTERM_PLATFORM=lazycat
      # The platform login gate already does authentication, so access control
      # is handed to it entirely: only requests carrying the gateway header
      # (X-NexTerm-Gateway-Auth) injected by the inject above are let through,
      # and the first such request becomes the "platform owner" account and
      # automatically gets a session. That is why Lazycat neither generates
      # nor needs a one-time init code.
      - NEXTERM_AUTH=platform
      # Behind a reverse proxy the gateway rewrites Host to the upstream
      # address, so same-origin checks must know this instance's public domain.
      # Use the AppDomain rendered at deploy time instead of hardcoding:
      # moving to another box or domain needs no change here.
      # The scheme-qualified form is also given to cover both matching styles.
      - NEXTERM_ALLOWED_ORIGINS={{ .S.AppDomain }},https://{{ .S.AppDomain }}
