# NexTerm 的 LPK 静态包元数据（懒猫微服）。
#
# 自 LPK v2 起这些静态字段统一放这里，**不再**写到 lzc-manifest.yml 顶层。
# 用 `lzc-cli project lint` 可以自检 —— 它连着商店的要求一起查。

package: cloud.lazycat.app.nexterm
version: 0.2.1

name: NexTerm 运维终端
description: 浏览器里的 SSH / SFTP / Docker / 数据库一体化运维终端，凭据加密存在你自己的微服上。
author: Probius
license: MIT
homepage: https://github.com/ProbiusOfficial/NexTerm

# 首版**不**声明 admin_only：
# 它只影响「谁能看见这个应用」，而真正该由用户决定的是「要不要把它装在共享盒子上」。
# 等商店文案定稿时再决定（见 docs/LAZYCAT-PORT.md §12.5）。
admin_only: false

# 手机上打开一个 xterm 终端没有意义（没有 Ctrl、没有右键菜单、软键盘抢屏），
# 明确声明不支持，instead of 让用户装上一个用不了的应用。
unsupported_platforms:
  - ios
  - android

# 多语言元数据。
#
# 字段范围以官方 `spec/manifest.md` §十一 为准：`name` / `description` / `usage`。
# （`spec/package.md` §三 只列了 name / description，两页不一致；`usage` 以前者为准 ——
#  实测 lint 接受，见下。）
# `usage` 的**顶层**写法在 `lzc-manifest.yml` 里也有（那份是兜底文本，两处都要有）。
locales:
  zh-CN:
    name: NexTerm 运维终端
    description: 浏览器里的 SSH / SFTP / Docker / 数据库一体化运维终端。终端进程、会话与工作区布局都跑在你的微服上，关掉网页不断、换台设备接着用；凭据用微服注入的根密钥加密后只存在你自己的实例里。
    usage: |
      首次进入请到「设置 → 网络安全 → 凭据库」确认凭据库状态。

      终端进程、会话与工作区布局都跑在这台微服上，浏览器只是接上去看：
      关掉网页不会结束会话，换一台设备打开即可接管原来那条终端，接着看原来的输出。

      浏览器版由微服注入凭据库的根密钥（同一台微服、同一个应用内稳定），
      因此进程内存里会持有解密后的密钥。这台微服是您自己的硬件，这是为了让
      「打开浏览器就能连服务器」成立。如果需要更强的隔离，请不要在这台微服上
      保存生产环境的 SSH 口令，改用密钥认证。

      磁盘挂载（sshfs）依赖「挂载 FUSE 文件系统」权限；未授权时该入口会置灰并给出原因。

      端口转发在此平台上不可用：平台的端口暴露是裸 TCP 且不带鉴权，应用侧补不上这个洞。
      需要把远端端口开放给外部时，请改用微服平台自带的转发功能。
  en-US:
    name: NexTerm
    description: An all-in-one SSH / SFTP / Docker / database operations terminal in your browser. Terminal processes, sessions and workspace layout all run on your own microserver, so closing the page keeps them alive and another device picks up right where you left off. Credentials are encrypted with a root key injected by the microserver and stay on your own instance.
    usage: |
      On first launch, open Settings → Network Security → Vault to check the credential vault status.

      Terminal processes, sessions and workspace layout all run on this microserver; the browser
      only attaches to them. Closing the page does not end a session, and opening it from another
      device takes over the same terminal and replays its scrollback.

      In the browser build the vault master key is injected by the microserver (stable for this
      microserver and this app), so the decrypted key is held in process memory. The microserver is
      your own hardware, and this is what makes "open a browser and connect" possible. If you need
      stronger isolation, do not store production SSH passwords here — use key authentication.

      Disk mounting (sshfs) requires the "mount FUSE filesystem" permission. Without it the entry
      is greyed out with a readable reason.

      Port forwarding is not available on this platform: the platform exposes ports as raw TCP with
      no authentication, and the app cannot compensate for that. To expose a remote port, use the
      native forwarding feature of the microserver platform instead.

# 权限声明。`required` 是「不给就跑不起来」，`optional` 是「不给就少一块功能」。
permissions:
  # 应用的**全部价值**就是去连你的其他服务器，不给网络它没有意义。
  required:
    - net.internet
    - net.lan
  optional:
    # 磁盘挂载（sshfs）用。声明后平台会注入 /lzcinit/fusermount3 并加进 PATH，
    # 官方明确说 rclone / sshfs 这类标准 FUSE 客户端开箱可用（要求 LZCOS 1.6.1+）。
    #
    # 放 optional 而不是 required：老盒子（< 1.6.1）没有这个能力，
    # 放 required 会让整个应用装不上，而挂载只占功能的一小块。
    # 不可用时由 `mount_capability` 明确报原因 + 前端置灰入口。
    - fuse.mount
    # 长任务结束提醒（未接；声明着免得后补时要改商店元数据重新审核）。
    - user.notify
