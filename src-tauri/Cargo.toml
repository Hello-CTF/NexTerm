[package]
name = "nexterm"
version = "0.1.3"
description = "NexTerm — 一体化开发运维终端"
authors = ["NexTerm"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

# 桌面入口。服务端不使用它（服务端代码全部 `cfg(not(feature = "desktop"))`）。
#
# `required-features = ["desktop"]`：这样**服务端构建里根本不会产出这个 bin**
# （否则 Linux 容器镜像里会多一个只会打印「请用桌面模式构建」的空壳）。
# `--all-features` 含 desktop，所以 CI 的 `clippy --all-targets --all-features`
# 照样会编它。
[[bin]]
name = "nexterm"
path = "src/main.rs"
required-features = ["desktop"]
# main.rs 仅调用 run()，无单测；集成测试只依赖 nexterm_lib。
# 关闭后 cargo test 与 clippy --all-targets 不再重复链接空的测试壳。
test = false
bench = false

# 服务端入口（懒猫微包容器）。
#
# 这个**刻意不加** `required-features = ["server"]`：`--all-features` 会同时打开
# desktop 与 server，那时服务端代码整块被 cfg 掉，加了 required-features 也拦不住
# 它被编 —— 会直接报「找不到 main」。所以改为在 src/bin/nexterm-server.rs 内部
# 按 cfg 分叉（桌面模式下打印一行说明并 exit 2）。见该文件顶部的注释。
[[bin]]
name = "nexterm-server"
path = "src/bin/nexterm-server.rs"
test = false
bench = false

[lib]
name = "nexterm_lib"
# 只要 rlib。
#
# Tauri 模板默认给的是 ["staticlib", "cdylib", "rlib"]，那是给**移动端**
# （Android 要 cdylib、iOS 要 staticlib）用的。本项目只有桌面端，
# 而 staticlib 的代价很具体：debug 下生成 1.7 GB 的 nexterm_lib.lib
# （deps/ 里还再存一份），release 下也有 425 MB，链接时间一起变长。
# main.rs 只做 `nexterm_lib::run()`，rlib 完全够用。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 依赖修正 —— 没有代码直接使用这个 crate，纯粹是**构建域内的 feature 统一**。
#
# 链路：我们的 build-dep `tauri-build` → `tauri-utils` →（tauri-utils 对 schemars 也是
# build-dep）→ `schemars 0.8` → `indexmap 1.9.3`，整条都活在构建域（host）。
# resolver v2 下 build 域与 target 域的 feature 各自计算，所以必须写在
# [build-dependencies] 里才够得着 —— 写在 [dependencies] 里不起作用（试过）。
#
# 问题：indexmap 1.9 的 build.rs 有两条路 —— `std` feature 开着就跳过探测、直接 emit
# `has_std`；否则用打包进来的旧 autocfg 去探测 std。而旧 autocfg 的探测手法是编译
# `extern crate std;`，**新 rustc（实测 1.98）对这句会报 E0259「std 重复定义」**
# （Rust 2018 起 std 已隐式导入），于是探测判定为失败 → `has_std` 从未 emit →
# `IndexMap<K, V, S>` 失去默认类型参数；而 schemars 在 `preserve_order` 下按两泛型写
# `IndexMap<K, V>` → E0107，表现为整包编不出来（schemars 报 "expected 3 generic arguments"）。
# 显式打开 std 就让 build.rs 走第一条路，问题消失（与 indexmap 2.x 无关）。
indexmap = { version = "1.9", features = ["std"] }

[features]
# ── 双态开关（见 src/ipc_shim.rs 顶部说明）─────────────────────────────
#
# **主开关是 `desktop`**：桌面模式 = 它开启（默认）；服务端模式 = `not(feature = "desktop")`。
# 之所以不用「desktop / server 互斥」，是因为 CI 跑的是
# `clippy --all-targets --all-features` 与 `test --workspace` —— 互斥设计下
# `--all-features` 会同时打开两边、桌面入口与 bin 立刻编不过，**就得改 CI**。
# 现在 `--all-features` 等价于「service 关闭 + desktop 开启」= 桌面模式 = 现状，
# **CI 口径一行不用改**（见 docs/LAZYCAT-PORT.md §12.2）。
default = ["desktop"]

# 桌面版：Tauri 运行时 + 两个插件。
# 写成 `dep:` 形式而不是让 feature 与依赖同名，是为了**能用 `not(feature = "desktop")`
# 当服务端判据**（见 ipc_shim.rs）。若叫 `tauri`，就没法表达「不开 Tauri」。
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-global-shortcut",
]

# 服务端版（懒猫微包容器，Linux、无桌面、无 WebKit）。
# 构建写法固定为：cargo build --no-default-features --features server
# 本 feature 不参与 `cfg` 判据，只用来开启服务端专属可选依赖（axum）。
server = ["dep:axum"]

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }

# 服务端 HTTP / WebSocket。
#
# 桌面版不编它。这不只是体积问题：axum 带 hyper/tower，而 Tauri 链上已有另一套
# HTTP 栈，桌面版没有理由为服务端的东西多编一份 —— 也让 Linux 容器镜像不必
# 因为桌面依赖而拉 webkit2gtk。
axum = { version = "0.8", features = ["ws", "json"], optional = true }

# IPC 门面宏（桌面 / 服务端双态）。两侧都要，所以**不是** optional。
# 只包一层透明转发：桌面下等价于 `#[tauri::command]`，产物不变。
nexterm-ipc-macros = { path = "nexterm-ipc-macros" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util", "io-std", "sync", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
regex = "1"
base64 = "0.22"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
dirs = "6"

# 日志：按天滚动
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# 存储
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "mysql", "migrate", "macros", "chrono"] }
redis = { version = "0.27", features = ["tokio-comp"] }

# 加密
# argon2 / windows / reqwest 版本与 russh、pageant、winrm-rs 的依赖树对齐，避免同一大件编译两份。
argon2 = "0.6"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"

# 传输
russh = "0.63"
russh-sftp = "2"
portable-pty = "0.9"
vt100 = "0.16"
winrm-rs = "1.2"

# AI / HTTP
# 0.13 起 feature 名为 rustls，TLS 实现与 winrm-rs 一致，依赖树不再并存两套。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "socks"] }

# TS 类型生成：所有跨 IPC 类型只定义一份
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }

# SSH 代理：SOCKS5 与 HTTP CONNECT
tokio-socks = "0.5"

# 校验和：MD5 与 SHA256
md-5 = "0.10"
sha2 = "0.10"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

# macOS：Keychain 顶替 DPAPI 的「免主密码」凭据保护（信封密钥存登录钥匙串）；
# objc2-app-kit 直改 NSWindow —— tao/wry 的运行时标题栏 API 只翻内部标志，
# 红绿灯需要真实样式掩码含 Titled 位。
[target."cfg(target_os = \"macos\")".dependencies]
security-framework = "3"
objc2-app-kit = { version = "0.3", features = ["NSWindow"] }

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "terminal_throughput"
harness = false
