[package]
name = "nexterm"
version = "0.1.1"
description = "NexTerm — 一体化开发运维终端"
authors = ["NexTerm"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "nexterm"
path = "src/main.rs"
# main.rs 仅调用 run()，无单测；集成测试只依赖 nexterm_lib。
# 关闭后 cargo test 与 clippy --all-targets 不再重复链接空的测试壳。
test = false
bench = false

[lib]
name = "nexterm_lib"
# 只要 rlib。
#
# Tauri 模板默认给的是 ["staticlib", "cdylib", "rlib"]，那是给**移动端**
# （Android 要 cdylib、iOS 要 staticlib）用的。本项目只有桌面端，
# 而 staticlib 的代价很具体：debug 下生成 1.7 GB 的 nexterm_lib.lib
# （deps/ 里还再存一份），release 下也有 425 MB，链接时间一起变长。
# main.rs 只做 `nexterm_lib::run()`，rlib 完全够用。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "io-util", "io-std", "sync", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "2"
regex = "1"
base64 = "0.22"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
encoding_rs = "0.8"
dirs = "6"

# 日志：按天滚动
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# 存储
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "mysql", "migrate", "macros", "chrono"] }
redis = { version = "0.27", features = ["tokio-comp"] }

# 加密
# argon2 / windows / reqwest 版本与 russh、pageant、winrm-rs 的依赖树对齐，避免同一大件编译两份。
argon2 = "0.6"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"

[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }

# 传输
russh = "0.63"
russh-sftp = "2"
portable-pty = "0.9"
vt100 = "0.16"
winrm-rs = "1.2"

# AI / HTTP
# 0.13 起 feature 名为 rustls，TLS 实现与 winrm-rs 一致，依赖树不再并存两套。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "socks"] }

# TS 类型生成：所有跨 IPC 类型只定义一份
ts-rs = { version = "10", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }

# SSH 代理：SOCKS5 与 HTTP CONNECT
tokio-socks = "0.5"

# 校验和：MD5 与 SHA256
md-5 = "0.10"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[[bench]]
name = "terminal_throughput"
harness = false
