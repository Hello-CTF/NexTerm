[package]
name = "nexterm-ipc-macros"
version = "0.2.2"
description = "NexTerm IPC 门面宏：把 #[tauri::command] 变成「桌面 / 服务端」双态"
authors = ["NexTerm"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing", "printing", "proc-macro", "clone-impls"] }
