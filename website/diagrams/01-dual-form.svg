<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
      .mono { font-family: ui-monospace, Menlo, "Cascadia Mono", monospace; }
      .t-title  { font-size: 40px; font-weight: 700; fill: #eef1f6; }
      .t-sub    { font-size: 20px; fill: #8a919f; }
      .t-card   { font-size: 29px; font-weight: 700; fill: #eef1f6; }
      .t-desc   { font-size: 17px; fill: #8a919f; }
      .t-li     { font-size: 17px; fill: #b3bac6; }
      .t-tag    { font-size: 13.5px; letter-spacing: 1.6px; }
      .t-chip   { font-size: 15px; fill: #9aa6c4; }
      .t-kernel { font-size: 26px; font-weight: 700; fill: #eef1f6; }
      .t-cap    { font-size: 15px; fill: #616877; }
    </style>
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#516cd6"/>
    </marker>
    <marker id="both" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b9de4"/>
    </marker>
    <marker id="bothStart" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#8b9de4"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0e1015"/>

  <text class="t-title" x="84" y="88">一个内核，两种形态</text>
  <text class="t-sub" x="84" y="128">同一份 Go 代码 —— 跑成桌面 App，也跑成服务端；部署一次，浏览器打开即用</text>

  <!-- ═══ 左：桌面 App ═══ -->
  <rect x="84" y="180" width="641" height="430" rx="18" fill="#141821" stroke="#2b3346" stroke-width="1.5"/>
  <text class="t-tag mono" x="124" y="230" fill="#8b9de4">DESKTOP · WAILS</text>
  <text class="t-card" x="120" y="284">桌面 App</text>
  <text class="t-desc" x="120" y="320">本地优先，功能完整</text>

  <circle cx="132" cy="375" r="4" fill="#516cd6"/>
  <text class="t-li" x="150" y="381">本地终端 · SSH · WinRM · 文件 · Docker · 数据库</text>
  <circle cx="132" cy="425" r="4" fill="#516cd6"/>
  <text class="t-li" x="150" y="431">AI 助手：工具调用 · 权限护栏 · 终端接管</text>
  <circle cx="132" cy="475" r="4" fill="#516cd6"/>
  <text class="t-li" x="150" y="481">凭据加密存本机（DPAPI / 主密码）</text>

  <rect x="120" y="530" width="122" height="42" rx="9" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="181" y="557" text-anchor="middle">Windows</text>
  <rect x="254" y="530" width="104" height="42" rx="9" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="306" y="557" text-anchor="middle">macOS</text>

  <!-- ═══ 中间：资产同步 ═══ -->
  <line x1="740" y1="398" x2="860" y2="398" stroke="#8b9de4" stroke-width="2"
        marker-end="url(#both)" marker-start="url(#bothStart)"/>
  <text class="t-cap mono" x="800" y="378" text-anchor="middle" fill="#8b9de4">资产同步</text>
  <text class="t-cap mono" x="800" y="428" text-anchor="middle">HTTPS</text>

  <!-- ═══ 右：服务端 ═══ -->
  <rect x="875" y="180" width="641" height="430" rx="18" fill="#141821" stroke="#2b3346" stroke-width="1.5"/>
  <text class="t-tag mono" x="915" y="230" fill="#8b9de4">SERVER · GO</text>
  <text class="t-card mono" x="911" y="284">nexterm-server</text>
  <text class="t-desc" x="911" y="320">部署一次，随处可用</text>

  <circle cx="923" cy="375" r="4" fill="#516cd6"/>
  <text class="t-li" x="941" y="381">部署到 懒猫微服 / 自建服务器</text>
  <circle cx="923" cy="425" r="4" fill="#516cd6"/>
  <text class="t-li" x="941" y="431">浏览器打开即用，不装客户端</text>
  <circle cx="923" cy="475" r="4" fill="#516cd6"/>
  <text class="t-li" x="941" y="481">同一套界面与命令，充当同步对端</text>

  <rect x="911" y="530" width="122" height="42" rx="9" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="972" y="557" text-anchor="middle">浏览器</text>
  <rect x="1045" y="530" width="140" height="42" rx="9" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip" x="1115" y="557" text-anchor="middle">懒猫微服</text>
  <rect x="1197" y="530" width="158" height="42" rx="9" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip" x="1276" y="557" text-anchor="middle">自建服务器</text>

  <!-- ═══ 底座：同一份内核 ═══ -->
  <rect x="84" y="676" width="1432" height="180" rx="18" fill="#171c2a" stroke="#3d4d8f" stroke-width="1.5"/>
  <text class="t-kernel" x="120" y="730">同一份 Go 内核</text>
  <text class="t-desc" x="120" y="764">同一份命令清单 —— 两端共用，不分叉（桌面行为逐字节不变，由双平台 CI 守着）</text>

  <rect x="120" y="792" width="140" height="44" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="190" y="820" text-anchor="middle">session</text>
  <rect x="271" y="792" width="140" height="44" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="341" y="820" text-anchor="middle">terminal</text>
  <rect x="422" y="792" width="140" height="44" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="492" y="820" text-anchor="middle">transport</text>
  <rect x="573" y="792" width="140" height="44" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="643" y="820" text-anchor="middle">fs</text>
  <rect x="724" y="792" width="140" height="44" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="794" y="820" text-anchor="middle">docker</text>
  <rect x="875" y="792" width="140" height="44" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="945" y="820" text-anchor="middle">db</text>
  <rect x="1026" y="792" width="140" height="44" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="1096" y="820" text-anchor="middle">ai</text>
  <rect x="1177" y="792" width="140" height="44" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="1247" y="820" text-anchor="middle">vault</text>
  <rect x="1328" y="792" width="140" height="44" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="1398" y="820" text-anchor="middle">store</text>

  <!-- 连接：内核 → 两端 -->
  <line x1="404" y1="670" x2="404" y2="620" stroke="#516cd6" stroke-width="2" marker-end="url(#up)"/>
  <line x1="1196" y1="670" x2="1196" y2="620" stroke="#516cd6" stroke-width="2" marker-end="url(#up)"/>
</svg>
