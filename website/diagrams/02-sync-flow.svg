<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
      .mono { font-family: ui-monospace, Menlo, "Cascadia Mono", monospace; }
      .t-title { font-size: 40px; font-weight: 700; fill: #eef1f6; }
      .t-sub   { font-size: 20px; fill: #8a919f; }
      .t-h     { font-size: 25px; font-weight: 700; fill: #eef1f6; }
      .t-li    { font-size: 16.5px; fill: #b3bac6; }
      .t-tag   { font-size: 13.5px; letter-spacing: 1.4px; fill: #8b9de4; }
      .t-step  { font-size: 15.5px; fill: #c8d0e0; }
      .t-num   { font-size: 15px; font-weight: 700; fill: #0e1015; }
      .t-cap   { font-size: 15px; fill: #8a919f; }
      .t-key   { font-size: 17px; font-weight: 700; fill: #eef1f6; }
      .t-val   { font-size: 16px; fill: #9aa6c4; }
    </style>
    <marker id="a-push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b9de4"/>
    </marker>
    <marker id="a-pull" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M10,0 L0,5 L10,10 z" fill="#55c483"/>
    </marker>
    <marker id="a-step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#516cd6"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0e1015"/>

  <text class="t-title" x="84" y="88">跨实例资产同步</text>
  <text class="t-sub" x="84" y="128">桌面把主机、分组与凭据配好，一键送到对端；之后手机、平板、浏览器接着用</text>

  <!-- ═══ 左：本机 ═══ -->
  <rect x="84" y="180" width="600" height="352" rx="18" fill="#141821" stroke="#2b3346" stroke-width="1.5"/>
  <text class="t-tag mono" x="120" y="228">本机 · 桌面版</text>
  <text class="t-h" x="116" y="280">要搬走的那一份</text>
  <text class="t-li" x="120" y="334">资产库：SQLite（WAL）</text>
  <text class="t-li" x="120" y="382">凭据库：DPAPI / 主密码 —— 同步前必须先解锁</text>
  <text class="t-li" x="120" y="430">分组、资产、凭据、片段整组同步，方向（推 / 拉）按按钮定</text>
  <text class="t-val mono" x="120" y="486" fill="#616877">内置「当前设备」不参与搬运</text>

  <!-- ═══ 右：对端 ═══ -->
  <rect x="916" y="180" width="600" height="352" rx="18" fill="#141821" stroke="#2b3346" stroke-width="1.5"/>
  <text class="t-tag mono" x="952" y="228">对端 · 服务端</text>
  <text class="t-h" x="948" y="280">落地的那一份</text>
  <text class="t-li" x="952" y="334">同步对象按账号隔离，密文落库</text>
  <text class="t-li" x="952" y="382">只存密文与数据密钥信封 —— 内容不解读</text>
  <text class="t-li" x="952" y="430">每轮回报：拉取 / 应用 / 推送 / 跳过</text>
  <text class="t-val mono" x="952" y="486" fill="#616877">公网地址强制 HTTPS</text>

  <!-- ═══ 中间：两个方向 ═══ -->
  <line x1="700" y1="300" x2="900" y2="300" stroke="#8b9de4" stroke-width="2" marker-end="url(#a-push)"/>
  <text class="t-cap mono" x="800" y="282" text-anchor="middle" fill="#8b9de4">推送到对端</text>

  <line x1="900" y1="404" x2="700" y2="404" stroke="#55c483" stroke-width="2" marker-end="url(#a-pull)"/>
  <text class="t-cap mono" x="800" y="386" text-anchor="middle" fill="#55c483">从对端拉取</text>

  <text class="t-cap mono" x="800" y="462" text-anchor="middle" fill="#616877">方向显式</text>
  <text class="t-cap mono" x="800" y="486" text-anchor="middle" fill="#616877">/sync/v2 · 会话 + CSRF</text>

  <!-- ═══ 凭据链路 ═══ -->
  <rect x="84" y="556" width="1432" height="140" rx="18" fill="#171c2a" stroke="#3d4d8f" stroke-width="1.5"/>
  <text class="t-tag mono" x="120" y="594">凭据怎么过去 —— 每账号一把数据密钥：客户端密封，服务端只存密文</text>

  <rect x="120" y="608" width="250" height="64" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-step" x="245" y="646" text-anchor="middle">账号密码登录</text>
  <line x1="373" y1="640" x2="397" y2="640" stroke="#516cd6" stroke-width="2" marker-end="url(#a-step)"/>

  <rect x="400" y="608" width="250" height="64" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-step" x="525" y="646" text-anchor="middle">解锁数据密钥</text>
  <line x1="653" y1="640" x2="677" y2="640" stroke="#516cd6" stroke-width="2" marker-end="url(#a-step)"/>

  <rect x="680" y="608" width="250" height="64" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-step" x="805" y="646" text-anchor="middle">客户端密封对象</text>
  <line x1="933" y1="640" x2="957" y2="640" stroke="#516cd6" stroke-width="2" marker-end="url(#a-step)"/>

  <rect x="960" y="608" width="250" height="64" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-step" x="1085" y="646" text-anchor="middle">服务端盲存密文</text>
  <line x1="1213" y1="640" x2="1237" y2="640" stroke="#516cd6" stroke-width="2" marker-end="url(#a-step)"/>

  <rect x="1240" y="608" width="250" height="64" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-step" x="1365" y="646" text-anchor="middle">对端解密使用</text>

  <!-- ═══ 两条规则 ═══ -->
  <rect x="84" y="728" width="706" height="128" rx="16" fill="#141821" stroke="#2b3346" stroke-width="1.5"/>
  <text class="t-key" x="120" y="774">冲突怎么办</text>
  <text class="t-val" x="120" y="808">逐对象按修订号裁决，新的那份赢</text>
  <text class="t-val" x="120" y="836">删除以墓碑同步，两端收敛一致</text>

  <rect x="810" y="728" width="706" height="128" rx="16" fill="#141821" stroke="#2b3346" stroke-width="1.5"/>
  <text class="t-key" x="846" y="774">哪些不搬</text>
  <text class="t-val" x="846" y="808">AI 对话 · 审计日志 —— 本地行为记录，不参与同步</text>
  <text class="t-val" x="846" y="836">会话记录 · 已知主机 · AI 档案 —— 默认不搬，需要时逐类打开</text>
</svg>
