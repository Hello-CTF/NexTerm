<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
      .mono { font-family: ui-monospace, Menlo, "Cascadia Mono", monospace; }
      .t-title  { font-size: 40px; font-weight: 700; fill: #eef1f6; }
      .t-sub    { font-size: 20px; fill: #8a919f; }
      .t-card   { font-size: 27px; font-weight: 700; fill: #eef1f6; }
      .t-cardS  { font-size: 22px; font-weight: 700; fill: #eef1f6; }
      .t-desc   { font-size: 16.5px; fill: #8a919f; }
      .t-li     { font-size: 16.5px; fill: #b3bac6; }
      .t-tag    { font-size: 13.5px; letter-spacing: 1.6px; }
      .t-chip   { font-size: 15px; fill: #9aa6c4; }
      .t-cap    { font-size: 14.5px; fill: #616877; }
      .t-h      { font-size: 21px; font-weight: 700; fill: #eef1f6; }
    </style>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#516cd6"/>
    </marker>
    <marker id="flowDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6478"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#0e1015"/>

  <text class="t-title" x="84" y="88">服务端权威运行态：多台设备，一个工作台</text>
  <text class="t-sub" x="84" y="128">布局、终端与回滚缓冲都留在服务端：浏览器只是接上去看，关掉网页不影响它</text>

  <!-- ═══ 左：服务端（权威） ═══ -->
  <rect x="84" y="176" width="700" height="432" rx="18" fill="#171c2a" stroke="#3d4d8f" stroke-width="1.5"/>
  <text class="t-tag mono" x="124" y="222" fill="#8b9de4">SERVER · AUTHORITATIVE</text>
  <text class="t-card" x="120" y="272">服务端持有运行态</text>
  <text class="t-desc" x="120" y="304">换设备、关网页、多人同看，都以这一侧为准</text>

  <circle cx="132" cy="360" r="4" fill="#516cd6"/>
  <text class="t-li" x="150" y="366">布局：工作区 / 分屏 / 标签结构，带 revision 乐观锁</text>
  <circle cx="132" cy="408" r="4" fill="#516cd6"/>
  <text class="t-li" x="150" y="414">终端：真 PTY + 回滚缓冲（环形缓冲 + vt100 网格）</text>
  <circle cx="132" cy="456" r="4" fill="#516cd6"/>
  <text class="t-li" x="150" y="462">会话池：一台资产一条连接，关网页不断连</text>
  <circle cx="132" cy="504" r="4" fill="#516cd6"/>
  <text class="t-li" x="150" y="510">事件：/ws/events 广播 + /ws/channel/{id} 推送</text>

  <rect x="120" y="540" width="180" height="44" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="210" y="568" text-anchor="middle">layout_get / put</text>
  <rect x="312" y="540" width="180" height="44" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="402" y="568" text-anchor="middle">terminal_attach</text>
  <rect x="504" y="540" width="240" height="44" rx="10" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-chip mono" x="624" y="568" text-anchor="middle">subscribers / viewers</text>

  <!-- ═══ 右：三台设备 ═══ -->
  <rect x="844" y="176" width="672" height="128" rx="16" fill="#141821" stroke="#2b3346" stroke-width="1.5"/>
  <text class="t-tag mono" x="880" y="212" fill="#8b9de4">DEVICE 01 · CONTROLLER</text>
  <text class="t-cardS" x="876" y="250">笔记本 · 正在操作</text>
  <text class="t-desc" x="876" y="282">键盘输入被接受；PTY 尺寸按这台设备的窗口排</text>

  <rect x="844" y="328" width="672" height="128" rx="16" fill="#141821" stroke="#2b3346" stroke-width="1.5"/>
  <text class="t-tag mono" x="880" y="364" fill="#8b9de4">DEVICE 02 · OBSERVER</text>
  <text class="t-cardS" x="876" y="402">平板 · 只读观看</text>
  <text class="t-desc" x="876" y="434">画面同源；写入会被拒（not_controller），点「接管控制」即可夺回</text>

  <rect x="844" y="480" width="672" height="128" rx="16" fill="#141821" stroke="#2b3346" stroke-width="1.5"/>
  <text class="t-tag mono" x="880" y="516" fill="#8b9de4">DEVICE 03 · NEW</text>
  <text class="t-cardS" x="876" y="554">又一台设备 · 接管既有终端</text>
  <text class="t-desc" x="876" y="586">按布局里记着的标签 id 接管，服务端清屏后回放历史</text>

  <!-- 服务端 → 设备 -->
  <line x1="792" y1="240" x2="836" y2="240" stroke="#516cd6" stroke-width="2" marker-end="url(#flow)"/>
  <line x1="792" y1="392" x2="836" y2="392" stroke="#5b6478" stroke-width="1.6" marker-end="url(#flowDim)"/>
  <line x1="792" y1="544" x2="836" y2="544" stroke="#516cd6" stroke-width="2" marker-end="url(#flow)"/>

  <!-- ═══ 底座：三条不变量 ═══ -->
  <rect x="84" y="648" width="1432" height="192" rx="18" fill="#141821" stroke="#2b3346" stroke-width="1.5"/>
  <text class="t-h" x="120" y="694">三条不变量</text>

  <rect x="120" y="716" width="440" height="96" rx="12" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-cardS" x="146" y="752" font-size="19">关网页 ≠ 关会话</text>
  <text class="t-li" x="146" y="782" font-size="15">只断这一端的订阅；进程与回滚留在服务端继续跑</text>

  <rect x="580" y="716" width="440" height="96" rx="12" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-cardS" x="606" y="752" font-size="19">关标签 = 三选一</text>
  <text class="t-li" x="606" y="782" font-size="15">后台继续 / 结束进程 / 取消，可在「后台会话」接管</text>

  <rect x="1040" y="716" width="440" height="96" rx="12" fill="#1b2130" stroke="#2b3446"/>
  <text class="t-cardS" x="1066" y="752" font-size="19">控制权按设备</text>
  <text class="t-li" x="1066" y="782" font-size="15">同一时刻一台设备能写；后来者默认观察，最后活跃者赢</text>
</svg>
