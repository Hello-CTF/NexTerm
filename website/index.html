<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexTerm - 服务器运维，一个窗口完成</title>
    <meta name="description" content="NexTerm 把 SSH、WinRM、远程文件、Docker、数据库和 AI 助手放在一个工作台，支持桌面端和浏览器访问。" />
    <meta property="og:title" content="NexTerm - 服务器运维，一个窗口完成" />
    <meta property="og:description" content="终端、文件、Docker、数据库和 AI 助手，集中在一个跨平台工作台。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nexterm.work/" />
    <meta property="og:image" content="https://nexterm.work/images/shell-dark.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/brand/nexterm-mark-128.png" />
    <script>
      (function () {
        var saved = localStorage.getItem("nexterm.site.theme");
        var system = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : system;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
