<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NexTerm - 一个工作台，管好每一台服务器</title>
    <meta name="description" content="NexTerm 是开源、可自托管的运维工作台：断线不丢的持久终端，能动手排查的 AI 助手，文件、容器和数据库都在同一个窗口里。" />
    <meta property="og:title" content="NexTerm - 一个工作台，管好每一台服务器" />
    <meta property="og:description" content="NexTerm 是开源、可自托管的运维工作台：断线不丢的持久终端，能动手排查的 AI 助手，文件、容器和数据库都在同一个窗口里。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nexterm.work/" />
    <meta property="og:image" content="https://nexterm.work/images/shell-dark.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/brand/nexterm-mark-128.png" />
    <script>
      (function () {
        var language = localStorage.getItem("nexterm.site.language");
        if (!language) language = navigator.language && navigator.language.toLowerCase().startsWith("en") ? "en" : "zh";
        document.documentElement.lang = language === "en" ? "en" : "zh-CN";
        if (language === "en") {
          document.title = "NexTerm - One workbench for every server you run";
          document.querySelector('meta[name="description"]')?.setAttribute("content", "NexTerm is an open source, self-hostable ops workbench: persistent terminals that survive disconnects, an AI assistant that investigates and fixes, and files, containers, and databases in one window.");
        }
        var saved = localStorage.getItem("nexterm.site.theme");
        var system = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : system;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
