<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexTerm - 让远程终端，随时跟着你走</title>
    <meta name="description" content="NexTerm 是开源的远程终端工作台，支持持久 SSH 会话、文件、容器、数据库和 AI 辅助排障。" />
    <meta property="og:title" content="NexTerm - 让远程终端，随时跟着你走" />
    <meta property="og:description" content="持久 SSH 会话、文件、容器、数据库和 AI 辅助排障，集中在一个开源工作台。" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nexterm.work/" />
    <meta property="og:image" content="https://nexterm.work/images/shell-dark.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/brand/nexterm-mark-128.png" />
    <script>
      (function () {
        var language = localStorage.getItem("nexterm.site.language");
        if (!language) language = navigator.language && navigator.language.toLowerCase().startsWith("en") ? "en" : "zh";
        document.documentElement.lang = language === "en" ? "en" : "zh-CN";
        if (language === "en") {
          document.title = "NexTerm - Your remote terminals, wherever you are";
          document.querySelector('meta[name="description"]')?.setAttribute("content", "NexTerm is an open source workbench for persistent SSH terminals, files, containers, databases, and AI-assisted troubleshooting.");
        }
        var saved = localStorage.getItem("nexterm.site.theme");
        var system = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : system;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
